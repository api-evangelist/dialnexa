openapi: 3.2.0
info:
  title: DialNexa LLMs API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: LLMs
paths:
  /v1/llms:
    get:
      operationId: listLlms
      parameters:
      - name: page
        required: false
        in: query
        description: Page number, starting at 1. Must be a whole number; 0 or below is treated as 1.
        schema:
          example: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Models per page. Must be a whole number. Default 20; 0 also returns 20, values above 100 are treated as 100, and a negative value fails with 500.
        schema:
          example: 20
          type: number
      - name: sortBy
        required: false
        in: query
        description: Column to sort by, for example id, name or provider. Default id. An unknown column returns 500.
        schema:
          example: id
          type: string
      - name: sortOrder
        required: false
        in: query
        description: Sort direction. Default ASC.
        schema:
          enum:
          - ASC
          - DESC
          type: string
      responses:
        '200':
          description: LLMs returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: llm_mfgt5q2x8k4w7r
                      description: Signed LLM ID
                    name:
                      type: string
                    provider:
                      enum:
                      - google
                      - openai
                      - deepseek
                      - groq
                      - gemini
                      - sarvam
                      type: string
                  required:
                  - id
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: llm_mfgt5q2x8k4w7r
                    name: GPT-4.1 Mini
                    provider: openai
        '400':
          description: Bad request - invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Validation failed (numeric string is expected)'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List LLMs
      tags:
      - LLMs
      description: Returns one page of the language models available as an agent's primary LLM. Defaults to 20 models per page; limits above 100 are capped at 100. The API-key response is a plain array without pagination metadata.
  /v1/llms/fallback:
    get:
      operationId: listFallbackLlms
      parameters:
      - name: page
        required: false
        in: query
        description: Page number, starting at 1. Must be a whole number; 0 or below is treated as 1.
        schema:
          example: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Models per page. Must be a whole number. Default 20; 0 also returns 20, values above 100 are treated as 100, and a negative value fails with 500.
        schema:
          example: 20
          type: number
      - name: sortBy
        required: false
        in: query
        description: Column to sort by, for example id, name or provider. Default id. An unknown column returns 500.
        schema:
          example: id
          type: string
      - name: sortOrder
        required: false
        in: query
        description: Sort direction. Default ASC.
        schema:
          enum:
          - ASC
          - DESC
          type: string
      responses:
        '200':
          description: Fallback LLM returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: llm_mfgt5q2x8k4w7r
                      description: Signed LLM ID
                    name:
                      type: string
                    provider:
                      enum:
                      - google
                      - openai
                      - deepseek
                      - groq
                      - gemini
                      - sarvam
                      type: string
                  required:
                  - id
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: llm_mh2k7w9q4x1zpt
                    name: Gemini 3.1 Flash Lite
                    provider: gemini
        '400':
          description: Bad request - invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Validation failed (numeric string is expected)'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Fallback LLMs
      tags:
      - LLMs
      description: Returns one page of eligible fallback language models. Defaults to 20 models per page; limits above 100 are capped at 100. The API-key response is a plain array without pagination metadata.
  /v1/llms/{id}:
    get:
      operationId: getLlm
      parameters:
      - name: id
        required: true
        in: path
        description: LLM ID
        schema:
          example: llm_mfgt5q2x8k4w7r
          type: string
      responses:
        '200':
          description: LLM returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: llm_mfgt5q2x8k4w7r
                    description: Signed LLM ID
                  name:
                    type: string
                  provider:
                    enum:
                    - google
                    - openai
                    - deepseek
                    - groq
                    - gemini
                    - sarvam
                    type: string
                required:
                - id
              examples:
                success:
                  summary: Successful response
                  value:
                    id: llm_mfgt5q2x8k4w7r
                    name: GPT-4.1 Mini
                    provider: openai
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '404':
          description: LLM not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    message: 'Could not find LLM with id: abc12345678901'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: Get LLM Details
      tags:
      - LLMs
      description: Returns one large language model catalog record by ID. It does not check primary or fallback eligibility, so a model returned here may not be accepted in that role.
components:
  schemas:
    FilteredErrorResponse:
      type: object
      description: Error body on calls, batch calls, voices, languages and LLMs, which return only the message (and data for a coded refusal).
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable refusal code.
          description: 'Present for a coded refusal: code and the details listed for that code.'
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - message
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
