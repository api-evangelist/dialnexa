                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      llms:
                        type: array
                        description: LLMs, each with an unprefixed id, name and model_category.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            model_category:
                              type: string
                      transcribers:
                        type: array
                        description: Transcribers, each with an unprefixed id, name, provider and model_id.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            provider:
                              type: string
                            model_id:
                              type: string
                      languages:
                        type: array
                        description: Languages, each with an unprefixed id, name and code.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            code:
                              type: string
                    required:
                    - llms
                    - transcribers
                    - languages
                    additionalProperties: false
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Missing, expired, or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 error
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Server error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
      security:
      - bearer: []
      summary: Get Agent Builder Inventory
      tags:
      - Agent Builder
      description: 'Returns the model, transcriber, and language catalog the builder resolves a configuration from. IDs are unprefixed. The catalog is not filtered to your workspace: it lists at most 100 primary LLMs.'
  /v1/agent-builder/run:
    post:
      description: Generates a draft configuration from structured answers. This operation does not save or publish an agent. A build can take longer than the 60 second HTTP timeout; use Stream Agent Build for long builds.
      operationId: runAgentBuilder
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentBuilder'
            examples:
              request:
                value:
                  structured_input:
                    company_and_offering:
                      description: Company and offering
                      value: Acme provides appointment scheduling software.
                    target_customer:
                      description: Target customer
                      value: Small business owners who requested a demo.
                    primary_goal:
                      description: Call goal
                      value: Arrange a product demo.
                    success_criteria:
                      description: Success criteria
                      value: Confirm interest and a preferred callback time.
                    information_to_collect:
                      description: Information to collect
                      value: Name and preferred callback time.
                    objections_and_faqs:
                      description: Questions
                      value: Explain that the demo is free.
                    agent_tone:
                      description: Tone
                      value: Friendly, concise, and professional.
                    additional_context:
                      description: Context
                      value: Do not promise pricing or unavailable appointment slots.
