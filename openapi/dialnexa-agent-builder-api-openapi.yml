openapi: 3.2.0
info:
  title: DialNexa Agent Builder API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Agent Builder
paths:
  /v1/agent-builder/classify-shape:
    post:
      operationId: classifyAgentBlueprint
      summary: Classify Agent Blueprint
      description: Recommends an agent type from structured blueprint answers. No agent is created or published. Uses a model-assisted recommendation with rule-based fallback when the model is unavailable.
      tags:
      - Agent Builder
      security:
      - bearer: []
      parameters: []
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      shape:
                        type: string
                        enum:
                        - spa
                        - cfa
                        - ivr
                      pipeline:
                        type: string
                        enum:
                        - cascaded
                        - s2s
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                      evidence:
                        type: array
                        items:
                          type: string
                      needsTiebreak:
                        type: boolean
                      features:
                        type: object
                        additionalProperties: true
                  timestamp:
                    type: string
                    format: date-time
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
              examples:
                success:
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      shape: spa
                      pipeline: cascaded
                      confidence: 0.8
                      evidence:
                      - One focused call objective.
                      needsTiebreak: false
                      features:
                        collectCount: 2
                        collectIsMandatory: false
                        faqCount: 3
                        successIsProcedural: false
                        hasRoutingIntent: false
                        hasProcedureIntent: false
                        hasJudgementIntent: true
                        wantsNaturalness: true
                        hasComplianceConstraint: false
                        languageIsEnglish: true
                        decisionPointCount: 0
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: A blueprint field has an invalid type or exceeds its length limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: primary_goal must be shorter than or equal to 4000 characters
                    errors:
                    - primary_goal must be shorter than or equal to 4000 characters
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_and_offering:
                  type: string
                  maxLength: 4000
                target_customer:
                  type: string
                  maxLength: 4000
                primary_goal:
                  type: string
                  maxLength: 4000
                success_criteria:
                  type: string
                  maxLength: 4000
                information_to_collect:
                  type: string
                  maxLength: 4000
                objections_and_faqs:
                  type: string
                  maxLength: 4000
                agent_tone:
                  type: string
                  maxLength: 4000
                additional_context:
                  type: string
                  maxLength: 4000
                language:
                  type: string
                  maxLength: 120
            examples:
              request:
                value:
                  primary_goal: Book a callback
                  language: English
  /v1/agent-builder/shape-advisor:
    post:
      operationId: recommendAgentType
      summary: Recommend Agent Type
      description: Recommends an agent type, a two-agent combination, or a clarifying question from a plain-language description. No agent is created or published.
      tags:
      - Agent Builder
      security:
      - bearer: []
      parameters: []
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      shape:
                        type:
                        - string
                        - 'null'
                      agent_type:
                        type:
                        - string
                        - 'null'
                      pipeline:
                        type: string
                        enum:
                        - Cascaded
                        - Speech_To_Speech
                      combo:
                        type:
                        - object
                        - 'null'
                        properties:
                          front:
                            type: string
                          then:
                            type: string
                      clarify:
                        type:
                        - string
                        - 'null'
                      why:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
              examples:
                success:
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      shape: spa
                      agent_type: Single_Prompt_Agent
                      pipeline: Cascaded
                      combo: null
                      clarify: null
                      why: One focused conversation can handle this goal.
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: Description is missing, has an invalid type, or exceeds 2000 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: description must be shorter than or equal to 2000 characters
                    errors:
                    - description must be shorter than or equal to 2000 characters
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: The recommendation could not be generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
              - description
            examples:
              request:
                value:
                  description: Call new customers and book a callback.
  /v1/agent-builder/inventory:
    get:
      operationId: getAgentBuilderInventory
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
