components:
  schemas:
    RunAgentBuilder:
      type: object
      properties:
        structured_input:
          description: Structured blueprint submission - each field has a description (field guidance) and value (user answer)
          allOf:
          - $ref: '#/components/schemas/StructuredBlueprintInput'
        build_attempt:
          type: integer
          description: Build attempt number (1-2). Validation runs only on attempt 1; attempt 2 skips re-validation.
          minimum: 1
          maximum: 2
          default: 1
        pipeline:
          type: string
          description: Engine for the generated agent. "s2s" builds the realtime pipeline on the same single-prompt agent; anything else builds the cascaded pipeline.
          enum:
          - cascaded
          - s2s
          default: cascaded
        target_shape:
          type: string
          description: Kind of agent to build. "cfa" writes a conversation-flow document (a step graph), "ivr" writes a touch-tone menu; anything else builds a single-prompt agent.
          enum:
          - spa
          - cfa
          - ivr
          default: spa
      required:
      - structured_input
    StructuredBlueprintInput:
      type: object
      properties:
        company_and_offering:
          $ref: '#/components/schemas/StructuredBlueprintField'
        target_customer:
          $ref: '#/components/schemas/StructuredBlueprintField'
        primary_goal:
          $ref: '#/components/schemas/StructuredBlueprintField'
        success_criteria:
          $ref: '#/components/schemas/StructuredBlueprintField'
        information_to_collect:
          $ref: '#/components/schemas/StructuredBlueprintField'
        objections_and_faqs:
          $ref: '#/components/schemas/StructuredBlueprintField'
        agent_tone:
          $ref: '#/components/schemas/StructuredBlueprintField'
        additional_context:
          $ref: '#/components/schemas/StructuredBlueprintField'
        validation_clarifications:
          $ref: '#/components/schemas/StructuredBlueprintField'
      required:
      - company_and_offering
      - target_customer
      - primary_goal
      - success_criteria
      - information_to_collect
      - objections_and_faqs
      - agent_tone
      - additional_context
    ErrorResponse:
      type: object
      description: Error body on endpoints without response filtering.
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: boolean
          enum:
          - true
        success:
          type: boolean
          enum:
          - false
        data:
          oneOf:
          - type: object
            properties:
              code:
                type: string
                description: Machine-readable refusal code.
          - type: array
            items: {}
          description: For a coded refusal, an object with code and the details listed for that code. Otherwise an empty array.
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Validation messages for a 400. Empty for other errors.
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - statusCode
      - error
      - success
      - data
      - message
      - errors
    GenerateAgentTone:
      type: object
      properties:
        company_and_offering:
          type: string
        target_customer:
          type: string
        primary_goal:
          type: string
        success_criteria:
          type: string
        information_to_collect:
          type: string
        objections_and_faqs:
          type: string
      required:
      - company_and_offering
      - target_customer
      - primary_goal
      - success_criteria
      - information_to_collect
      - objections_and_faqs
    GenerateObjectives:
      type: object
      properties:
        company_and_offering:
          type: string
          description: Company name and what the business offers
          example: Acme Corp - B2B payroll software for mid-market HR teams.
        target_customer:
          type: string
          description: Who the agent will speak with
          example: HR directors at 200-2,000 employee companies evaluating payroll vendors.
        primary_goal:
          type: string
          description: Primary outcome the agent should achieve on each call
          example: Book demos and answer pricing and onboarding questions.
      required:
      - company_and_offering
      - target_customer
      - primary_goal
    StructuredBlueprintField:
      type: object
      properties:
        description:
          type: string
          description: User-facing explanation of what this field is asking for
          example: Share your company name and a short description of your product, service, or industry.
        value:
          type: string
          description: User-provided answer for this field
          example: 'Acme Corp: we sell B2B payroll software for mid-market HR teams.'
      required:
      - description
      - value
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
