openapi: 3.2.0
info:
  title: DialNexa Languages API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Languages
paths:
  /v1/languages:
    get:
      operationId: listLanguages
      parameters: []
      responses:
        '200':
          description: Languages returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: lang_mfgsys4hhg8gdn
                      description: Signed language ID
                    code:
                      type: string
                      description: Short language code, for example en, hi or hi-en.
                      example: en
                    name:
                      type: string
                      example: English
                  required:
                  - id
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: lang_mfgsys4hhg8gdn
                    code: en
                    name: English
                  - id: lang_mfgsys4f62f0vb
                    code: hi
                    name: Hindi
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Languages
      tags:
      - Languages
      description: Returns the global language catalog as an array of id, code, and name. Check voices and transcribers separately for language compatibility.
  /v1/languages/{id}:
    get:
      operationId: getLanguage
      parameters:
      - name: id
        required: true
        in: path
        description: Language ID
        schema:
          example: lang_mfgsys4hhg8gdn
          type: string
      responses:
        '200':
          description: Language returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: lang_mfgsys4hhg8gdn
                    description: Signed language ID
                  code:
                    type: string
                    description: Short language code, for example en, hi or hi-en.
                    example: en
                  name:
                    type: string
                    example: English
                required:
                - id
              examples:
                success:
                  summary: Successful response
                  value:
                    id: lang_mfgsys4hhg8gdn
                    code: en
                    name: English
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '404':
          description: Language not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    message: Language with ID mfgsys4hhg8gdn not found
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: Get Language Details
      tags:
      - Languages
      description: Returns id, code, and name for one language catalog entry. Its presence does not guarantee compatibility with a particular voice or transcriber.
components:
  schemas:
    FilteredErrorResponse:
      type: object
      description: Error body on calls, batch calls, voices, languages and LLMs, which return only the message (and data for a coded refusal).
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable refusal code.
          description: 'Present for a coded refusal: code and the details listed for that code.'
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - message
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: DialNexa
  source: https://dialnexa.com/docs/api-reference/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
