                    errors: []
        '400':
          description: direction is missing or is not inbound or outbound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                invalidDirection:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: 'direction must be one of the following values: inbound, outbound'
                    errors:
                    - 'direction must be one of the following values: inbound, outbound'
        '404':
          description: The agent or number is not in this workspace, or the number is not linked to this agent in that direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                notLinked:
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
                    message: This number is not linked to this agent for outbound calls.
                    errors: []
        '409':
          description: The number is still in use. Resolve what data lists, then retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                usedByBatch:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: NUMBER_USED_BY_BATCH
                      batches:
                      - id: batch_abc123
                        title: September renewals
                        status: paused
                      live_calls: 0
                    message: 1 unfinished batch(es) ("September renewals") and 0 live call(s) use this number. Change the batches' number or cancel them first.
                    errors: []
                liveCalls:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_HAS_LIVE_CALLS
                      live_calls: 2
                      batches: []
                    message: 2 call(s) are in progress on this number. Wait for them to finish, then retry.
                    errors: []
                activeWorkflows:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS
                      affected_workflows:
                      - id: Xy7Kp2mQ9rT4vB
                        title: Lead follow-up
                        status: active
                    message: This phone number is used in 1 active workflow(s). Pause those workflows first, then retry.
                    errors: []
components:
  schemas:
    PronunciationItem:
      type: object
      properties:
        original_word:
          type: string
          maxLength: 128
          description: Word
          example: Nexa
        pronunciation_format:
          type: string
          maxLength: 128
          description: Pronunciation
          example: Nek-sa
        phonetic_pronunciation:
          type: string
          maxLength: 128
          description: Approx pronunciation
          example: Nek-sa
      required:
      - original_word
      - pronunciation_format
    UpdateAgentRequest:
      type: object
      properties:
        background_sound:
          type: string
          description: Background sound identifier. When ambient_noise is on, calls play the built-in background track whatever value is set; set it to a value other than none for background_sound_volume to apply.
        background_sound_volume:
          type: number
          minimum: 0
          maximum: 2
          description: Volume of the background sound (0 to 2). Applied only when ambient_noise is true and background_sound is set to a value other than none.
        ambient_noise:
          type: boolean
          description: Enable or disable ambient noise playback on the call
        responsiveness:
          type: number
          minimum: 0
          maximum: 1
          description: Seconds to wait after the caller stops speaking, 0 to 1. Stored on the agent version; not applied to calls.
        interruption_sensitivity:
          type: number
          minimum: 0
          maximum: 1
          description: Interruption sensitivity level (0 to 1). Stored on the agent version; not applied to calls.
        response_eagerness:
          type: number
          minimum: 0
          maximum: 1
          description: How eagerly the agent responds (0 to 1). Applied when the transcriber is Sarvam or Deepgram (Nova-2, Nova-3, Flux); Soniox agents ignore it.
        denoising_mode:
          type:
          - string
          - 'null'
          enum:
          - remove_noise
          - remove_noise_and_speech
          description: Denoising mode. Only remove_noise turns denoising on; remove_noise_and_speech leaves it off. Web calls run without denoising.
        denoise_strength:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 4
          description: Noise suppression strength 0-4 (higher = stronger)
        boosted_keywords:
          type: string
          maxLength: 2000
          description: 'Comma-separated list of words or phrases (e.g. "DialNexa, NexaFlow, customer success") used to bias the speech-to-text provider toward recognizing them correctly. This is a recognition bias, not a guarantee: it increases the likelihood of correctly transcribing uncommon names, brands, products, and domain vocabulary. Supported for Deepgram and Soniox transcribers (primary or fallback). Normalized to at most 100 unique terms (case-insensitive, duplicates removed, empty entries dropped) at the configuration boundary; empty/null means no boosted keywords.'
        boost_dynamic_variables:
          type: boolean
          description: 'When true, each call''s dynamic-variable VALUES (from the test-call form or a batch-call CSV lead: names, cities, order IDs) are appended to boosted_keywords for that call, so per-call uncommon words get the same recognition bias. Values are sanitized first (punctuation stripped, over-long entries dropped) and never evict the agent''s own configured terms, which always come first. Applies to Deepgram and Soniox only; defaults to false.'
        reminder_message_interval:
          type: number
          minimum: 0
          example: 10
          description: Seconds of silence before a reminder. Zero disables reminders. Keep at least five seconds below end_call_on_silence_sec when enabled.
        reminder_message_content:
          type:
          - string
          - 'null'
          maxLength: 150
          description: 'Reminder text spoken after reminder_message_interval seconds of silence, up to 150 characters. When unset, a language-appropriate default is spoken. On update, null (and an empty string) is ignored and the stored value is kept: the update only writes fields that are not null or empty.'
        transcriber_id:
          type:
          - string
          - 'null'
          description: ID of the transcriber catalog entry
        fallback_stt_enabled:
          type: boolean
          description: Enable parallel fallback STT for this agent
        stt_fallback_transcriber_id:
          type:
          - string
          - 'null'
          description: Fallback STT transcriber catalog entry
        stt_fallback_wait_ms:
          type:
          - number
          - 'null'
          minimum: 0
          description: Milliseconds to wait for primary STT after fallback finalizes first
        audio_cache_enabled:
          type: boolean
          description: TTS audio caching for this agent. Only DialNexa can disable it, so sending false returns 403. Omitting this field leaves the current value unchanged.
        voicemail_detection:
          type: boolean
          description: Indicates whether voicemail detection is enabled
          example: true
        hangup_on_voicemail:
          type: boolean
          description: Hang up immediately when voicemail is detected instead of leaving a message
          example: false
        voicemail_message:
          type: string
          description: Message spoken when voicemail is detected (only used when hangup_on_voicemail is false). Supports Handlebars template syntax ({{variable}}). Must be valid Handlebars.
          example: Hi, please call us back at your convenience.
        end_call_on_silence_sec:
          type: number
          minimum: 15
          maximum: 30
          description: 'Seconds of silence after which the call is automatically ended. Accepted range: 15 to 30 seconds. Must be at least 5 seconds above reminder_message_interval when reminders are configured.'
          example: 20
        end_call_on_hold_sec:
          type:
          - number
          - 'null'
          minimum: 10
          maximum: 60
          example: 20
          description: Seconds to wait during a sustained detected hold before ending a non-IVR call, 10 to 60. On update, null is ignored and the stored value is kept; an empty string fails validation and returns 400.
        max_call_duration_sec:
          type: number
          minimum: 60
          maximum: 5400
          description: 'Maximum call duration in seconds before the call is forcibly ended. Maximum accepted: 3600 seconds for speech-to-speech agents, 5400 seconds for cascaded agents.'
          example: 600
        ring_duration_sec:
          type: number
          description: 'Ring timeout for outbound Plivo calls in every workspace, default 30 seconds. Numeric input is rounded to a whole second and clamped to 10 through 30: 5 saves as 10, 90 as 30, and 22.6 as 23. Non-numeric input is rejected. Read the saved value after updating. Has no effect on inbound or web calls.'
          example: 30
        version_number:
          type: integer
          description: Version number to update, as a whole JSON number. current_version_number and version_number are returned as strings, so convert them before sending. A fractional value matches no version and returns 404.
          example: 1
        folder_id:
          type: string
          description: ID of the folder this agent belongs to
          example: f5k2m8x1q9w3zp
        pipeline_type:
          enum:
          - Cascaded
          - Speech_To_Speech
          type: string
          description: Pipeline subtype for Single_Prompt_Agent. Cascaded = ASR→LLM→TTS pipeline. Speech_To_Speech = direct speech model.
          example: Cascaded
        title:
          type: string
          minLength: 1
          maxLength: 70
          description: Title of the agent (max 70 characters)
          example: Customer Support Agent
        version_title:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          description: Version title, 1 to 150 characters. If omitted on create, the first version is titled "Version 0". On update, null is ignored and the stored value is kept; an empty string fails validation and returns 400.
          example: Version 1.1
        description:
          type: string
          description: Description of the agent
          example: This agent handles customer support inquiries
        timezone:
          type: string
          description: Timezone for the agent
          example: Asia/Kolkata
        system_prompt_text:
          type: string
          description: Static system instructions. Template variables such as {{customer_name}} are rejected with 400; use prompt_text for dynamic content.
          example: You are a helpful customer support agent named Sarah.
        language_id:
          type: string
          description: ID of the language the agent speaks
          example: lang_en_in
        secondary_language_ids:
          type: array
          items:
            type: string
          maxItems: 3
          description: Up to three additional language IDs in priority order. The chosen voice must support them. Send an empty array on update to clear.
        language_default_message:
          type:
          - string
          - 'null'
          maxLength: 500
          description: 'Optional message for an unsupported caller language, up to 500 characters, spoken in the primary language voice. On update, null (and an empty string) is ignored and the stored value is kept: the update only writes fields that are not null or empty.'
        llm_id:
          type: string
          description: ID of the LLM associated with the agent
          example: llm_A1B2C3D4E5F6G7
        llm_temperature:
          type: number
          minimum: 0
          maximum: 2
          description: LLM temperature from 0 to 2. Values outside this range return 400. Not applied to Speech-to-Speech agents.
          example: 1
        voice_id:
          type: string
          description: ID of the voice the agent speaks with. Use GET /v1/voices to browse available voices.
          example: voice_abc123
        prompt_text:
          type: string
          description: 'Main instructions for the agent. Supports Handlebars template syntax ({{variable}}) for dynamic content. Must be valid Handlebars: malformed syntax causes errors at call time.'
          example: Hello, how can I assist you today?
        ivr_menu:
          type: object
          description: 'IVR menu tree for IVR_Agent type: {entry_node, nodes{...}} with per-node prompt text + digit->node edges. Prompt audio is rendered + cached at publish.'
        welcome_message:
          type: string
          description: 'Opening message spoken by the agent at the start of the call. Supports Handlebars template syntax ({{variable}}). Must be valid Handlebars: malformed syntax causes errors at call time.'
          example: Welcome to our service!
        knowledge_base_ids:
          description: IDs of the knowledge bases attached to this agent version
          example:
          - kb_abc123
          - kb_def456
          type: array
          items:
            type: string
        kb_max_chunks:
          type: integer
          minimum: 1
          maximum: 10
          description: Maximum number of RAG chunks to fetch (1 to 10)
          example: 5
        kb_min_score:
          type: number
          minimum: 0
          maximum: 1
          description: Minimum similarity score threshold for RAG results (0 to 1)
          example: 0.5
        is_published:
          type: boolean
          description: Whether this version is published
          example: false
        default_dynamic_variables:
          type: object
          description: 'Default values for dynamic variables used in Handlebars templates. For call-transfer flows, the reserved key agent_transfer_destinations accepts a pipe-separated list of phone numbers (maximum 7). Each number must use a supported country code: US (+1) or India (+91), followed by exactly 10 digits (e.g. +11234567890|+919876543210).'
          example:
            firstName: John
            lastName: Doe
            courseType: Math
        fallback_llm_enabled:
          type: boolean
          description: Enable fallback LLM for this agent
          example: false
        llm_fallback_delay_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Milliseconds to wait before triggering the fallback LLM, a whole number of 0 or more. On update, null is ignored and the stored value is kept; an empty string fails validation and returns 400.
          example: 200
        llm_fallback_model:
          type:
          - string
          - 'null'
          description: 'ID of the LLM to use as fallback. On update, null (and an empty string) is ignored and the stored value is kept: the update only writes fields that are not null or empty.'
          example: llm_A1B2C3D4E5F6G7
        predictive_preprocessing_enabled:
          type: boolean
          description: Enable predictive preprocessing for this agent version. Not applied to Conversational Flow or Speech-to-Speech agents, or to web calls.
          example: false
        voice_model_id:
          type: string
          description: 'Speech synthesis model for the selected voice. Each voice is tied to a specific provider, and only that provider''s models are valid: submitting a model from a different provider will return 400. In most cases this field can be omitted; the recommended model for the chosen voice is applied automatically. For ElevenLabs voices, the supported model is eleven_flash_v2_5. To find supported models for a specific voice, call GET /v1/voices/{voice_id}/voice-models.'
          example: vm4k2p9x7q1z3r
        voice_speed:
          type: number
          minimum: 0.25
          maximum: 4
          description: Voice speed from 0.25 to 4. Values outside this range return 400. Soniox voices clamp it to 0.7 to 1.3. Speech-to-Speech agents apply it on OpenAI Realtime models only; Gemini Live ignores it.
          example: 1
        speech_to_speech_english_accent:
          type: string
          enum:
          - indian
          - british
          - american
          description: 'Accent of the agent''s English on Speech-to-Speech calls, for the whole call: indian (default), british or american.'
        voice_temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Voice temperature from 0 to 2. Values outside this range return 400. Applied by ElevenLabs and Smallest voices only.
          example: 1
        voice_volume:
          type: number
          minimum: -10
          maximum: 10
          description: Voice volume from -10 to 10. Values outside this range return 400. Applied by Cartesia voices (a negative value plays as 1, maximum 2), Sarvam voices (below 0.1 plays as 1, maximum 3) and Speech-to-Speech agents; other providers ignore it. New agents default to -0.363.
          example: 0
        voice_pitch:
          type: number
          minimum: -20
          maximum: 20
          description: Voice pitch from -20 to 20. Values outside this range return 400. Applied by Sarvam voices only.
          example: 0
        agent_identity:
          type: string
          description: Agent identity (required for Conversational_Flow_Agent type on update)
          example: You are a helpful customer support agent named Sarah.
        agent_background:
          type: string
          description: Agent background (required for Conversational_Flow_Agent type on update)
          example: You have 5 years of experience in customer support and specialize in helping customers with technical issues.
        post_call_analysis:
          description: Fields to extract after a call. Names must be unique and SELECTOR fields need choices. On update, replaces the full list for the draft version.
          type: array
          items:
            type: object
            properties:
              field_name:
                type: string
                minLength: 1
                pattern: \S
                description: Non-blank name, unique within this version.
              field_type:
                type: string
                enum:
                - TEXT
                - SELECTOR
                - BOOLEAN
                - NUMBER
                - DATETIME
              field_description:
                type: string
              additional_fields:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties: true
                description: For SELECTOR, supply at least one non-blank string, normally as an array. An object with an options array is also accepted.
              display_order:
                type: integer
                minimum: 0
                description: Defaults to the array index.
            required:
            - field_name
            - field_type
        agent_functions:
          description: Agent functions for this version. The list replaces the existing functions, except the platform end_call function, which is always kept. Pass an empty array to remove the others.
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - end_call
                - call_transfer
                - custom
                - check_calendar_availability
                - book_calendar
                - integration
              displayName:
                type: string
              display_name:
                type: string
                description: Alias for displayName.
              description:
                type: string
              config:
                type: object
                additionalProperties: true
            required:
            - type
        post_call_analysis_llm_id:
          type:
          - string
          - 'null'
          description: LLM used for post-call field extraction. Accepts a prefixed ID (for example `llm_A1B2C3D4E5F6G7`) or a raw ID; null clears it so the default extraction model (gpt-4o-mini) is used. It is stored on the version's existing post-call fields, so it has no effect when the version has none, and a replaced post_call_analysis list creates new fields without it, so they use the default extraction model. It is saved before the rest of the update is validated, so a request that is then rejected (400, 403 or 409) can still have changed it.
          example: llm_A1B2C3D4E5F6G7
        pronunciations:
          type: array
          items:
            $ref: '#/components/schemas/PronunciationItem'
          description: Pronunciation overrides. Applied by ElevenLabs and Cartesia voices; other providers ignore them. Only items with phonetic_pronunciation are applied.
      required:
      - version_number
    CodedErrorResponse:
      type: object
      description: Error body for a coded refusal; data carries code and its details.
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: boolean
          enum:
          - true
        success:
          type: boolean
          enum:
          - false
        data:
          oneOf:
          - type: object
            properties:
              code:
                type: string
                description: Machine-readable refusal code.
          - type: array
            items: {}
          description: For a coded refusal, an object with code and the details listed for that code. Otherwise an empty array.
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Validation messages for a 400. Empty for other errors.
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
