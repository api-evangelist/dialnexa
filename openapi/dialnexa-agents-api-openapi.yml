openapi: 3.2.0
info:
  title: DialNexa Agents API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Agents
paths:
  /v1/agents:
    post:
      description: 'Creates an agent with its first draft version. Optionally include `agent_functions` and `post_call_analysis` in the body to set them at creation time.


        **Phone numbers** are linked to the agent, not to a version. Once the agent has a published version, attach numbers with `POST /v1/agents/{agentId}/phone-numbers`.'
      operationId: createAgent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            examples:
              request:
                summary: Create an agent
                value:
                  title: Customer Support Agent
                  language_id: lang_en_in
                  voice_id: voice_abc123
                  llm_id: llm_A1B2C3D4E5F6G7
                  transcriber_id: trs_deepgram_nova_2
                  system_prompt_text: You are a helpful support agent. Confirm the customer issue and summarize next steps.
                  fallback_stt_enabled: true
                  stt_fallback_transcriber_id: trs_soniox
                  post_call_analysis:
                  - field_name: issue_type
                    field_type: TEXT
                    field_description: Main customer issue discussed on the call
                  agent_type: Single_Prompt_Agent
                  prompt_text: You are a helpful support agent. Confirm the customer's issue and summarize next steps.
      responses:
        '201':
          description: Agent created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/Agents'
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      id: agent_2g7Xy3tY53gRlp
                      folder_id: null
                      current_version_number: '0'
                      timezone: null
                      agent_type: Single_Prompt_Agent
                      pipeline_type: Cascaded
                      webhook_id: null
                      current_version:
                        agent_id: agent_2g7Xy3tY53gRlp
                        version_number: '0'
                        version_title: Version 0
                        title: Customer Support Agent
                        is_published: false
                        language_id: lang_en_in
                        voice_id: voice_abc123
                        llm_id: llm_A1B2C3D4E5F6G7
                        transcriber_id: trs_deepgram_nova_2
                        fallback_stt_enabled: true
                        stt_fallback_transcriber_id: trs_soniox
                      versions:
                      - agent_id: agent_2g7Xy3tY53gRlp
                        version_number: '0'
                        version_title: Version 0
                        title: Customer Support Agent
                        is_published: false
                        language_id: lang_en_in
                        voice_id: voice_abc123
                        llm_id: llm_A1B2C3D4E5F6G7
                        transcriber_id: trs_deepgram_nova_2
                        fallback_stt_enabled: true
                        stt_fallback_transcriber_id: trs_soniox
                      inbound_phone_numbers: []
                      outbound_phone_numbers: []
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: title must be shorter than or equal to 70 characters
                    errors:
                    - title must be shorter than or equal to 70 characters
                s2sLanguages:
                  summary: Speech-to-Speech agent with secondary languages on a non-Gemini model
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: Speech-to-Speech agents that speak more than one language run on Gemini Live. Pick a Gemini model or remove the secondary languages.
                    errors:
                    - Speech-to-Speech agents that speak more than one language run on Gemini Live. Pick a Gemini model or remove the secondary languages.
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '403':
          description: The request turns off a setting only DialNexa can disable (audio_cache_enabled or predictive_preprocessing_enabled set to false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 403 Forbidden
                  value:
                    statusCode: 403
                    error: true
                    success: false
                    data: []
                    message: Only super admins can disable audio cache. Please contact Dialnexa for disabling it.
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: 'Failed to create agent: Internal server error'
                    errors: []
        '404':
          description: 'A referenced resource was not found: the voice, the voice model, or a fallback voice from another workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Two agent_functions items have the same display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Duplicate function name
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data: []
                    message: Agent function with display name "book_meeting" already exists for this agent version
                    errors: []
      security:
      - bearer: []
      summary: Create Agent
      tags:
      - Agents
    get:
      description: 'Returns every agent in your organization with all versions. Agent functions and phone numbers are not included: fetch one agent by ID for them.'
      operationId: listAgents
      parameters: []
      responses:
        '200':
          description: Agents returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      agents:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentRecord'
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data:
                      agents:
                      - id: agent_2g7Xy3tY53gRlp
                        folder_id: null
                        current_version_number: '0'
                        timezone: Asia/Kolkata
                        agent_type: Single_Prompt_Agent
                        pipeline_type: Cascaded
                        webhook_id: null
                        current_version:
                          agent_id: agent_2g7Xy3tY53gRlp
                          version_number: '0'
                          version_title: Version 0
                          title: Customer Support Agent
                          is_published: false
                          language_id: lang_en_in
                          voice_id: voice_abc123
                          llm_id: llm_A1B2C3D4E5F6G7
                          transcriber_id: trs_deepgram_nova_2
                          fallback_stt_enabled: true
                          stt_fallback_transcriber_id: trs_soniox
                        versions:
                        - agent_id: agent_2g7Xy3tY53gRlp
                          version_number: '0'
                          version_title: Version 0
                          title: Customer Support Agent
                          is_published: false
                          language_id: lang_en_in
                          voice_id: voice_abc123
                          llm_id: llm_A1B2C3D4E5F6G7
                          transcriber_id: trs_deepgram_nova_2
                          fallback_stt_enabled: true
                          stt_fallback_transcriber_id: trs_soniox
                    timestamp: '2026-09-07T06:00:00.000Z'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: 'Failed to fetch all agents: Internal server error'
                    errors: []
      security:
      - bearer: []
      summary: List Agents
      tags:
      - Agents
  /v1/agents/{id}:
    patch:
      description: 'Updates the specified draft version of an agent. `version_number` is required.


        **Managing functions via this endpoint:**

        - Pass `agent_functions: [...]` to replace the version''s functions. The platform `end_call` function is always kept.

        - Pass `agent_functions: []` to remove every function except `end_call`.

        - Omit `agent_functions` entirely to leave existing functions untouched.


        **Post-call analysis LLM:**

        - Pass `post_call_analysis_llm_id`, for example `llm_A1B2C3D4E5F6G7`, to set the LLM used for post-call field extraction.

        - Pass `null` to clear it so the workspace default is used.

        - Omit the field to leave it unchanged.

        - It is stored on the version''s existing post-call fields: it has no effect when there are none, a replaced `post_call_analysis` list gets new fields without it, and it is saved before the rest of the request is validated, so a rejected request can still have changed it.


        **Phone numbers** are linked to the agent, not to a version. Manage them with `/v1/agents/{agentId}/phone-numbers`. Every version uses the agent''s numbers, and inbound calls run on the latest published version.


        **While a batch is running on this agent**, the request returns `409 Conflict` with code `AGENT_HAS_RUNNING_BATCH` when it would change a published version in place (runtime fields; `version_title` and `folder_id` can still change) or change `timezone` or `pipeline_type`. Drafts stay editable and can be published. The running batch keeps dialing the version it was created with.


        A published version cannot be edited. Runtime changes are blocked while a batch runs on the agent; edit and publish a new draft instead.


        Null is ignored for `end_call_on_hold_sec`, `language_default_message`, `version_title`, `reminder_message_content`, `llm_fallback_model` and `llm_fallback_delay_ms`: the stored value is kept.'
      operationId: updateAgent
      parameters:
      - name: id
        required: true
        in: path
        description: Agent ID
        schema:
          example: agent_2g7Xy3tY53gRlp
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
            examples:
              request:
                summary: Update a draft agent version
                value:
                  version_number: 0
                  title: Customer Support Agent
                  llm_id: llm_A1B2C3D4E5F6G7
                  fallback_stt_enabled: true
                  stt_fallback_transcriber_id: trs_soniox
                  post_call_analysis_llm_id: llm_A1B2C3D4E5F6G7
              clearPostCallAnalysisLlm:
                summary: Clear post-call analysis LLM override
                value:
                  version_number: 0
                  post_call_analysis_llm_id: null
              publishDraft:
                summary: Publish a draft version
                value:
                  version_number: 2
                  is_published: true
      responses:
        '200':
          description: Agent updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/Agents'
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data:
                      id: agent_2g7Xy3tY53gRlp
                      folder_id: null
                      current_version_number: '0'
                      timezone: Asia/Kolkata
                      agent_type: Single_Prompt_Agent
                      pipeline_type: Cascaded
                      webhook_id: null
                      current_version:
                        agent_id: agent_2g7Xy3tY53gRlp
                        version_number: '0'
                        version_title: Version 0
                        title: Customer Support Agent
                        is_published: false
                        language_id: lang_en_in
                        voice_id: voice_abc123
                        llm_id: llm_A1B2C3D4E5F6G7
                        transcriber_id: trs_deepgram_nova_2
                        fallback_stt_enabled: true
                        stt_fallback_transcriber_id: trs_soniox
                      versions:
                      - agent_id: agent_2g7Xy3tY53gRlp
                        version_number: '0'
                        version_title: Version 0
                        title: Customer Support Agent
                        is_published: false
                        language_id: lang_en_in
                        voice_id: voice_abc123
                        llm_id: llm_A1B2C3D4E5F6G7
                        transcriber_id: trs_deepgram_nova_2
                        fallback_stt_enabled: true
                        stt_fallback_transcriber_id: trs_soniox
                      inbound_phone_numbers: []
                      outbound_phone_numbers:
                      - id: phn_abc123
                        phone_number: '9876543210'
                        country_iso: '91'
                        nickname: Support line
                        sip_trunk_enabled: false
                        linked_at: '2026-09-30T06:00:00.000Z'
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: Invalid body, incompatible configuration, or, when publishing, a prompt over the size limit for the selected model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: version_number must be a number conforming to the specified constraints
                    errors:
                    - version_number must be a number conforming to the specified constraints
                s2sLanguages:
                  summary: Speech-to-Speech agent with secondary languages on a non-Gemini model
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: Speech-to-Speech agents that speak more than one language run on Gemini Live. Pick a Gemini model or remove the secondary languages.
                    errors:
                    - Speech-to-Speech agents that speak more than one language run on Gemini Live. Pick a Gemini model or remove the secondary languages.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '403':
          description: The version is already published, or the request turns off a setting only DialNexa can disable (audio_cache_enabled or predictive_preprocessing_enabled set to false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 403 Forbidden
                  value:
                    statusCode: 403
                    error: true
                    success: false
                    data: []
                    message: You cannot patch an already published agent version.
                    errors: []
        '404':
          description: Agent or version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
                    message: Agent with ID 2g7Xy3tY53gRlp not found
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: 'Failed to update agent: Internal server error'
                    errors: []
        '409':
          description: A batch is running on this agent and the request would change what it dials with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                agentHasRunningBatch:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: AGENT_HAS_RUNNING_BATCH
                      batches:
                      - id: batch_abc123
                        title: September renewals
                        status: running
                    message: Batch "September renewals" is running on this agent. Pause it or wait for it to finish, or publish a new version instead.
                    errors: []
      security:
      - bearer: []
      summary: Update Agent
      tags:
      - Agents
    delete:
      description: Deletes an agent and all its versions. Historical call records remain available.
      operationId: deleteAgent
      parameters:
      - name: id
        required: true
        in: path
        description: Agent ID
        schema:
          example: agent_2g7Xy3tY53gRlp
          type: string
      responses:
        '200':
          description: Agent deleted successfully.
          content:
            application/json:
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    timestamp: '2026-09-07T06:00:00.000Z'
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - timestamp
                description: The standard envelope without a data member.
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
                    message: Agent with ID 2g7Xy3tY53gRlp not found
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: 'Failed to delete agent: Internal server error'
                    errors: []
        '409':
          description: 'Conflict: the agent is used by active workflows (AGENT_USED_IN_ACTIVE_WORKFLOWS, with affected_workflows in data), or one of its numbers cannot be released yet (PHONE_NUMBER_HAS_LIVE_CALLS, NUMBER_USED_BY_BATCH, or PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS). Resolve what data lists, then retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                agentInActiveWorkflows:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: AGENT_USED_IN_ACTIVE_WORKFLOWS
                      affected_workflows:
                      - id: Xy7Kp2mQ9rT4vB
                        title: Lead follow-up
                        status: active
                    message: This agent is used in 1 active workflow(s). Deactivate those workflows first, then retry.
                    errors: []
                usedByBatch:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: NUMBER_USED_BY_BATCH
                      batches:
                      - id: batch_abc123
                        title: September renewals
                        status: paused
                      live_calls: 0
                    message: 1 unfinished batch(es) ("September renewals") and 0 live call(s) use this number. Change the batches' number or cancel them first.
                    errors: []
                liveCalls:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_HAS_LIVE_CALLS
                      live_calls: 2
                      batches: []
                    message: 2 call(s) are in progress on this number. Wait for them to finish, then retry.
                    errors: []
                activeWorkflows:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS
                      affected_workflows:
                      - id: Xy7Kp2mQ9rT4vB
                        title: Lead follow-up
                        status: active
                    message: This phone number is used in 1 active workflow(s). Pause those workflows first, then retry.
                    errors: []
      security:
      - bearer: []
      summary: Delete Agent
      tags:
      - Agents
    get:
      description: Returns the agent with all versions. Each version includes `agent_functions`, `pronunciations`, and `postcall_analysis` embedded.
      operationId: getAgent
      parameters:
      - name: id
        required: true
        in: path
        description: Agent ID
        schema:
          example: agent_2g7Xy3tY53gRlp
          type: string
      responses:
        '200':
          description: Agent returned with all versions and embedded agent_functions.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AgentRecord'
                    - type: object
                      properties:
                        inbound_phone_numbers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: phn_abc123
                              phone_number:
                                type: string
                                example: '9876543210'
                                description: The number without its country calling code.
                              country_iso:
                                type: string
                                example: '91'
                                description: Country calling code.
                              nickname:
                                type:
                                - string
                                - 'null'
                                description: Label set in the dashboard.
                              sip_trunk_enabled:
                                type: boolean
                              linked_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: When the number was linked to the agent, when known.
                            required:
                            - id
                            - phone_number
                            - country_iso
                            - nickname
                            - sip_trunk_enabled
                            - linked_at
                          description: Numbers that ring this agent. Up to 3.
                        outbound_phone_numbers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: phn_abc123
                              phone_number:
                                type: string
                                example: '9876543210'
                                description: The number without its country calling code.
                              country_iso:
                                type: string
                                example: '91'
                                description: Country calling code.
                              nickname:
                                type:
                                - string
                                - 'null'
                                description: Label set in the dashboard.
                              sip_trunk_enabled:
                                type: boolean
                              linked_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: When the number was linked to the agent, when known.
                            required:
                            - id
                            - phone_number
                            - country_iso
                            - nickname
                            - sip_trunk_enabled
                            - linked_at
                          description: Numbers the agent can call from. Up to 3.
                  timestamp:
                    type: string
                    format: date-time
