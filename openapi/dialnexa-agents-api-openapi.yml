  /v1/agent-versions/{agentId}/version/{versionNumber}/prompt-review:
    post:
      description: Reviews one agent version prompt and configuration without editing or publishing the agent.
      operationId: reviewAgentPrompt
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
        description: Signed agent ID.
      - name: versionNumber
        required: true
        in: path
        schema:
          type: number
        description: Agent version number to review.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptReviewRequest'
            examples:
              focusedReview:
                summary: Review speech, contradictions, and hallucination risks
                value:
                  checks:
                  - speech
                  - conflicts
                  - unknowable
      responses:
        '201':
          description: Prompt review completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    required:
                    - review_fingerprint
                    - findings
                    - new_warning_count
                    - reviewed_at
                    - degraded
                    - cached
                    - fix_prefill
                    properties:
                      review_fingerprint:
                        type: string
                        description: SHA-256 of the reviewed prompt and the version's default variable names.
                      findings:
                        type: array
                        items:
                          type: object
                          required:
                          - severity
                          - family
                          - kind
                          - message
                          - fingerprint
                          - acknowledged
                          properties:
                            severity:
                              type: string
                              enum:
                              - warning
                              - info
                            family:
                              type: string
                              enum:
                              - prompt
                              - config
                            kind:
                              type: string
                              enum:
                              - contradiction
                              - hallucination_risk
                              - undefined_variable
                              - unused_variable
                              - thin_prompt
                              - missing_section
                              - tts_dashes
                              - instruction_misaligned
                              - instruction_inert
                              - speech_unfriendly
                              - flow_break
                              - flow_note
                              - branch_gap
                              - fallback_without_model
                              - fallback_same_as_primary
                              - welcome_script_mismatch
                              - unused_knowledge_base
                              - postcall_field_ungrounded
                              - timeout_extreme
                              - language_not_configured
                              - language_lock_conflict
                              - language_switch_unconfigured
                              - number_format_conflict
                              - language_script_unconfigured
                              - language_conflict
                            message:
                              type: string
                            evidence:
                              type:
                              - string
                              - 'null'
                            fingerprint:
                              type: string
                              pattern: ^[0-9a-f]{40}$
                            acknowledged:
                              type: boolean
                      new_warning_count:
                        type: integer
                        minimum: 0
                      reviewed_at:
                        type: string
                        format: date-time
                      degraded:
                        type: boolean
                      cached:
                        type: boolean
                        description: True when a stored report was reused. The cache key covers the prompt, the default variable names, the checks and the review engine, not other version settings, so after changing only settings a stored report can be returned.
                      fix_prefill:
                        type:
                        - string
                        - 'null'
                        description: An editing instruction built from up to three unacknowledged warnings, starting "Fix these prompt review findings:". Null when there are none.
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Review with one warning
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      review_fingerprint: 12a8f88ad6f0f521347705e2af1417f1fc8396f2e2913fcb056082ee1c51723f
                      findings:
                      - severity: warning
                        family: prompt
                        kind: contradiction
                        message: 'The prompt conflicts with the platform''s call-time rules: Never end the call until the customer agrees to book a demo.'
                        evidence: Never end the call until the customer agrees to book a demo.
                        fingerprint: 318c8c636a975f8879bdf2db85a2a0df1d6aa738
                        acknowledged: false
                      new_warning_count: 1
                      reviewed_at: '2026-08-31T03:15:00.000Z'
                      degraded: false
                      cached: false
                      fix_prefill: 'Fix these prompt review findings:

                        1) Resolve this contradiction between rules: Never end the call until the customer agrees to book a demo.'
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: 'Invalid request body: prompt_text is not a string or exceeds 100000 characters, or checks is not an array of known check groups.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent version not found in the authenticated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      summary: Review An Agent Prompt
      tags:
      - Agents
