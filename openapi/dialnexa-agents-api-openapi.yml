    post:
      operationId: attachAgentPhoneNumber
      summary: Attach Agent Phone Number
      description: Links a workspace phone number to an agent for inbound or outbound calls. The agent needs a published version and can have at most 3 numbers per direction. A number serves one agent per direction. Set move to true to detach it from its current agent and attach it here in one transaction; live calls, unfinished outbound batches, and active outbound workflows can block the move.
      tags:
      - Agents
      security:
      - bearer: []
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          example: agent_2g7Xy3tY53gRlp
          type: string
        description: Agent ID from List Agents.
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Link record ID.
                      agent_id:
                        type: string
                        example: agent_2g7Xy3tY53gRlp
                      phone_number_id:
                        type: string
                        example: phn_abc123
                      direction:
                        type: string
                        enum:
                        - inbound
                        - outbound
                        description: 'inbound: the number rings this agent. outbound: the agent calls from it.'
                      linked_at:
                        type: string
                        format: date-time
                      linked_by:
                        type:
                        - string
                        - 'null'
                        description: User who created the link, when known.
                      unlinked_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Null while the link is current.
                      unlinked_by:
                        type:
                        - string
                        - 'null'
                        description: User who ended the link, when known.
                      unlink_reason:
                        type:
                        - string
                        - 'null'
                        enum:
                        - manual
                        - agent_deleted
                        - number_deleted
                        - number_released
                        description: 'Why the link ended: manual (detached), agent_deleted, number_deleted, or number_released (the rental expired or the number was withdrawn). Null while the link is current.'
                    required:
                    - id
                    - agent_id
                    - phone_number_id
                    - direction
                    - linked_at
                    - unlinked_at
                    - unlink_reason
                  timestamp:
                    type: string
                    format: date-time
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
              examples:
                success:
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      id: k2m9q4wz1abcde
                      direction: outbound
                      linked_at: '2026-09-30T06:00:00.000Z'
                      linked_by: null
                      unlinked_at: null
                      unlinked_by: null
                      unlink_reason: null
                      agent_id: agent_2g7Xy3tY53gRlp
                      phone_number_id: phn_abc123
                    timestamp: '2026-09-07T06:00:00.000Z'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '400':
          description: The agent has no published version, already has 3 numbers in this direction, or the body is invalid. A SIP trunk number is also refused for a Conversational Flow agent whose published version has a call transfer node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                agentNotPublished:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data:
                      code: AGENT_NOT_PUBLISHED
                    message: Publish the agent before attaching a phone number.
                    errors: []
                limitReached:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_LIMIT_REACHED
                      limit: 3
                    message: An agent can have at most 3 outbound numbers.
                    errors: []
                sipTrunkWithCallTransfer:
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: SIP trunk numbers cannot be used for conversational flow agents that include a call transfer node.
                    errors:
                    - SIP trunk numbers cannot be used for conversational flow agents that include a call transfer node.
        '403':
          description: DialNexa's shared default number cannot answer inbound calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                defaultNumberInbound:
                  value:
                    statusCode: 403
                    error: true
                    success: false
                    data:
                      code: DEFAULT_NUMBER_NOT_ALLOWED_INBOUND
                    message: A default number cannot be used for inbound calls.
                    errors: []
        '404':
          description: The agent or the phone number is not in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                agentNotFound:
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
                    message: Agent agent_2g7Xy3tY53gRlp not found in your organization.
                    errors: []
                phoneNumberNotFound:
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
                    message: Phone number phn_abc123 not found in your organization.
                    errors: []
        '409':
          description: The number is already linked, or moving it is blocked by calls, outbound batches, or outbound workflows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedErrorResponse'
              examples:
                alreadyLinked:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_ALREADY_LINKED
                    message: This number is already linked to this agent for outbound calls.
                    errors: []
                linkedToOtherAgent:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_LINKED_TO_OTHER_AGENT
                      agent_id: agent_7h2Kq9Lm4Np3Rs
                      agent_title: Collections
                    message: 'This number is linked to Collections for outbound calls. Detach it there first, or send move: true to move it to this agent.'
                    errors: []
                usedByBatch:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: NUMBER_USED_BY_BATCH
                      batches:
                      - id: batch_abc123
                        title: September renewals
                        status: paused
                      live_calls: 0
                    message: 1 unfinished batch(es) ("September renewals") and 0 live call(s) use this number. Change the batches' number or cancel them first.
                    errors: []
                liveCalls:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_HAS_LIVE_CALLS
                      live_calls: 2
                      batches: []
                    message: 2 call(s) are in progress on this number. Wait for them to finish, then retry.
                    errors: []
                activeWorkflows:
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS
                      affected_workflows:
                      - id: Xy7Kp2mQ9rT4vB
                        title: Lead follow-up
                        status: active
                    message: This phone number is used in 1 active workflow(s). Pause those workflows first, then retry.
                    errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAgentPhoneNumberRequest'
            examples:
              request:
                value:
                  phone_number_id: phn_abc123
                  direction: outbound
