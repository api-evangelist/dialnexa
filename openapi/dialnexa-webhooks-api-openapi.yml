openapi: 3.2.0
info:
  title: DialNexa Webhooks API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Webhooks
paths:
  /v1/user-webhooks:
    post:
      description: Registers a webhook URL for your workspace. The response is the only one that returns the plain secret; store it securely. DialNexa sends one signed POST when a call that was not started by a batch call ends, with no retry and no timeout. The x-nexa-signature header is sha256=, an HMAC-SHA256 of the raw request body with your secret.
      operationId: createWebhook
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            examples:
              request:
                summary: Create a webhook
                value:
                  url: https://example.com/dialnexa/webhook
                  events:
                  - call.completed
                  is_active: true
                  secret: replace-with-a-long-random-secret
      responses:
        '201':
          description: Webhook created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Webhook created successfully
                      webhook:
                        type: object
                        properties:
                          id:
                            type: string
                            example: webhook_c9v3nz8rq4pmxa
                            description: Webhook ID with the `webhook_` prefix.
                          org_id:
                            type: string
                            example: o14XKPP84rt22g
                            description: Owning workspace ID, without the `org_` prefix.
                          url:
                            type: string
                            format: uri
                            example: https://example.com/dialnexa/webhook
                          events:
                            type: array
                            items:
                              type: string
                            example:
                            - call.completed
                            description: Stored and returned as sent. It does not filter deliveries today.
                          is_active:
                            type: boolean
                            example: true
                            description: Inactive subscriptions receive no deliveries.
                          secret:
                            type: string
                            example: replace-with-a-long-random-secret
                            description: The plain secret you sent. Shown only in this response.
                          last_triggered_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: When a delivery was last attempted, whether or not your endpoint accepted it.
                          is_deleted:
                            type: boolean
                            example: false
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      message: Webhook created successfully
                      webhook:
                        id: webhook_c9v3nz8rq4pmxa
                        org_id: o14XKPP84rt22g
                        url: https://example.com/dialnexa/webhook
                        events:
                        - call.completed
                        is_active: true
                        secret: replace-with-a-long-random-secret
                        last_triggered_at: null
                        is_deleted: false
                        created_at: '2026-07-03T10:30:00.000Z'
                        updated_at: '2026-07-03T10:30:00.000Z'
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: Bad request - missing required fields or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: url must be a URL address
                    errors:
                    - url must be a URL address
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
