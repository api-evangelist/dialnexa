components:
  schemas:
    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://webhook.site/updated-endpoint
          description: The new URL for the webhook.
        events:
          minItems: 1
          example:
          - call.completed
          description: Updated list of events.
          type: array
          items:
            type: string
        is_active:
          type: boolean
          example: false
          description: Whether the webhook is active.
        secret:
          type: string
          example: replace-with-a-new-long-random-secret
          description: New secret for signing payloads.
    ErrorResponse:
      type: object
      description: Error body on endpoints without response filtering.
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: boolean
          enum:
          - true
        success:
          type: boolean
          enum:
          - false
        data:
          oneOf:
          - type: object
            properties:
              code:
                type: string
                description: Machine-readable refusal code.
          - type: array
            items: {}
          description: For a coded refusal, an object with code and the details listed for that code. Otherwise an empty array.
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Validation messages for a 400. Empty for other errors.
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - statusCode
      - error
      - success
      - data
      - message
      - errors
    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://webhook.site/your-endpoint
          description: The URL to which webhook events will be sent.
        events:
          minItems: 1
          example:
          - call.completed
          description: List of events this webhook is subscribed to.
          type: array
          items:
            type: string
        is_active:
          type: boolean
          example: true
          description: Whether the webhook is active.
        secret:
          type: string
          example: replace-with-a-long-random-secret
          description: Secret used to sign webhook payloads.
      required:
      - url
      - events
      - secret
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
