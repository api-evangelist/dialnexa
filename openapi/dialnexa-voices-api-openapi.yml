openapi: 3.2.0
info:
  title: DialNexa Voices API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Voices
paths:
  /v1/voices:
    get:
      description: Returns voices with optional filtering by provider, accent, gender, or name. Without llm_id it returns text-to-speech voices only; with llm_id it returns only the voices linked to that LLM.
      operationId: listVoices
      parameters:
      - name: provider
        required: false
        in: query
        description: Filter by TTS provider
        schema:
          enum:
          - elevenlabs
          - smallestai
          - sarvam
          - cartesia
          - soniox
          type: string
      - name: accent
        required: false
        in: query
        description: Accent of the voice
        schema:
          enum:
          - indian
          - british
          - american
          - canadian
          - african
          - australian
          - swedish
          type: string
      - name: gender
        required: false
        in: query
        description: Gender of the voice
        schema:
          enum:
          - male
          - female
          - non-binary
          type: string
      - name: name
        required: false
        in: query
        description: Search by voice name
        schema:
          example: English
          type: string
      - name: page
        required: false
        in: query
        description: Page number (starts from 1)
        schema:
          minimum: 1
          default: 1
          example: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Results per page. Default 20, maximum 50; a larger value returns 400.
        schema:
          minimum: 1
          maximum: 50
          default: 20
          example: 20
          type: number
      - name: language_id
        required: false
        in: query
        description: Filter voices that support a specific language ID
        schema:
          example: lang_mfgsys4hhg8gdn
          type: string
      - name: llm_id
        required: false
        in: query
        description: Filter voices compatible with a specific LLM ID (S2S models only)
        schema:
          example: llm_mfgt5q2x8k4w7r
          type: string
      - name: language_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated language IDs. The voice must support every selected language.
      responses:
        '200':
          description: Voices returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    gender:
                      type: string
                    provider:
                      type: string
                    accent:
                      type:
                      - string
                      - 'null'
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: voice_mfgt2k9x4q7w1z
                    name: Aditi
                    gender: female
                    provider: elevenlabs
                    accent: indian
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
        '400':
          description: 'A query value is invalid: page or limit below 1 or not a whole number, limit above 50, or a provider, accent or gender outside its list.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                limit:
                  summary: limit above 50
                  value:
                    message: 'Request validation failed: limit must not be greater than 50'
                page:
                  summary: page below 1
                  value:
                    message: 'Request validation failed: page must not be less than 1'
                accent:
                  summary: Unknown accent
                  value:
                    message: 'Request validation failed: accent must be one of the following values: '
      security:
      - bearer: []
      summary: List Voices
      tags:
      - Voices
  /v1/voices/accents:
    get:
      description: Returns the distinct accent values across all non-deleted voices in the catalog, optionally filtered by provider. The list is not scoped to the workspace, so an accent can return no voices in List Voices.
      operationId: listVoiceAccents
      parameters:
      - name: provider
        required: false
        in: query
        schema:
          enum:
          - elevenlabs
          - smallestai
          - sarvam
          - cartesia
          - soniox
          type: string
        description: Voice provider to list accents for. A value outside the list fails with 500.
      responses:
        '200':
          description: Voice accents returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: indian
              examples:
                success:
                  summary: Successful response
                  value:
                  - indian
                  - american
                  - british
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Voice Accents
      tags:
      - Voices
  /v1/voices/s2s:
    get:
      description: Returns voices that support speech-to-speech mode, along with their compatible languages and LLMs.
      operationId: listSpeechToSpeechVoices
      parameters: []
      responses:
        '200':
          description: Speech to speech voices returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: voice_mj18r4tq2w9xkp
                    name:
                      type: string
                      example: Ash
                    provider:
                      type:
                      - string
                      - 'null'
                      example: openai
                    provider_voice_id:
                      type:
                      - string
                      - 'null'
                      example: ash
                    gender:
                      type: string
                      example: male
                    accent:
                      type:
                      - string
                      - 'null'
                      example: american
                    icon:
                      type:
                      - string
                      - 'null'
                    recording:
                      type:
                      - string
                      - 'null'
                    languages:
                      type: array
                      items:
                        $ref: '#/components/schemas/SpeechToSpeechLanguage'
                    llms:
                      type: array
                      items:
                        $ref: '#/components/schemas/SpeechToSpeechModel'
                  required:
                  - id
                  - name
                  - provider
                  - provider_voice_id
                  - gender
                  - accent
                  - icon
                  - recording
                  - languages
                  - llms
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: voice_mj18r4tq2w9xkp
                    name: Ash
                    provider: openai
                    provider_voice_id: ash
                    gender: male
                    accent: american
                    icon: null
                    recording: https://speechailogs.blob.core.windows.net/openai-voices/openai-ash-tts.mp3
                    languages:
                    - id: lang_mfgsys4f62f0vb
                      name: Hindi
                      code: hi
                    - id: lang_mfgsys4hhg8gdn
                      name: English
                      code: en
                    llms:
                    - id: llm_mj17v3n8k2q5wd
                      name: GPT-realtime-2
                      provider: openai
                      provider_id: gpt-realtime-2
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Speech-to-Speech Voices
      tags:
      - Voices
  /v1/voices/{id}:
    get:
      operationId: getVoice
      parameters:
      - name: id
        required: true
        in: path
        description: Voice ID
        schema:
          example: voice_mfgt2k9x4q7w1z
          type: string
      responses:
        '200':
          description: Voice returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  gender:
                    type: string
                  provider:
                    type: string
                  accent:
                    type:
                    - string
                    - 'null'
              examples:
                success:
                  summary: Successful response
                  value:
                    id: voice_mfgt2k9x4q7w1z
                    name: Aditi
                    gender: female
                    provider: elevenlabs
                    accent: indian
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '404':
          description: Voice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    message: Voice not found
                notSupported:
                  summary: Voice outside the supported voice models
                  value:
                    message: Voice with ID 2g7Xy3tY53gRlp not found or is deleted
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: Get Voice Details
      tags:
      - Voices
      description: Returns one voice catalog record by ID.
  /v1/voices/{id}/languages:
    get:
      operationId: listVoiceLanguages
      parameters:
      - name: id
        required: true
        in: path
        description: Voice ID
        schema:
          example: voice_mfgt2k9x4q7w1z
          type: string
      responses:
        '200':
          description: Voice languages returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: lang_mfgsys4hhg8gdn
                    code:
                      type: string
                      example: en
                    name:
                      type: string
                      example: English
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: lang_mfgsys4hhg8gdn
                    code: en
                    name: English
                  - id: lang_mfgsys4f62f0vb
                    code: hi
                    name: Hindi
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '404':
          description: Voice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    message: Voice not found
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Voice Languages
      tags:
      - Voices
      description: Returns the languages supported by one voice.
  /v1/voices/language-options:
    get:
      operationId: listVoiceLanguageOptions
      summary: List Voice Language Options
      description: Lists languages that leave at least one compatible voice alongside all selected languages, scoped to the shared catalog and this workspace imports. Languages already in language_ids are not returned. API-key responses are a root array.
      tags:
      - Voices
      security:
      - bearer: []
      parameters:
      - name: language_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated selected language IDs. Omit for the initial list.
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: Optional comma-separated provider filters.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    code:
                      type: string
                    name:
                      type: string
                    voice_count:
                      type: integer
                      minimum: 0
                  required:
                  - id
                  - name
                  - code
                  - voice_count
              examples:
                success:
                  value:
                  - id: lang_mfgsys4f62f0vb
                    code: hi
                    name: Hindi
                    voice_count: 9
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
components:
  schemas:
    FilteredErrorResponse:
      type: object
      description: Error body on calls, batch calls, voices, languages and LLMs, which return only the message (and data for a coded refusal).
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable refusal code.
          description: 'Present for a coded refusal: code and the details listed for that code.'
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - message
    SpeechToSpeechLanguage:
      type: object
      properties:
        id:
          type: string
          example: lang_mfgsys4f62f0vb
        name:
          type: string
          example: Hindi
        code:
          type: string
          example: hi
      required:
      - id
      - name
      - code
    SpeechToSpeechModel:
      type: object
      properties:
        id:
          type: string
          example: llm_mj17v3n8k2q5wd
        name:
          type: string
          example: GPT-realtime-2
        provider:
          type: string
          example: openai
        provider_id:
          type: string
          example: gpt-realtime-2
      required:
      - id
      - name
      - provider
      - provider_id
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: DialNexa
  source: https://dialnexa.com/docs/api-reference/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
