openapi: 3.2.0
info:
  title: DialNexa Phone Numbers API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Phone Numbers
paths:
  /v1/phone-country-rules/countries:
    get:
      operationId: listPhoneCountryRules
      responses:
        '200':
          description: Active phone country rules returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneCountryRule'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      summary: List Phone Country Rules
      tags:
      - Phone Numbers
      description: Returns the active global country catalog with calling codes, number lengths, and prefixes.
  /v1/phone-country-rules/enabled-network-groups:
    get:
      operationId: listEnabledTelephonyNetworkGroups
      responses:
        '200':
          description: Enabled destination rules returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnabledTelephonyNetworkGroup'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      summary: List Enabled Telephony Network Groups
      tags:
      - Phone Numbers
      description: Returns one combined destination rule per country enabled for the authenticated workspace.
      parameters: []
  /v1/phone-number-pricing:
    get:
      operationId: listPhoneNumberPricing
      responses:
        '200':
          description: Phone number pricing returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberPricing'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      summary: List Phone Number Pricing
      tags:
      - Phone Numbers
      description: Returns the phone number rental pricing reference catalog by telephony provider and country. A purchase is charged the rental rate in the workspace billing plan, not this credit_cost.
  /v1/organization-phone-numbers:
    get:
      operationId: listPhoneNumbers
      parameters:
      - name: page
        required: false
        in: query
        description: Page number, starting from 1.
        schema:
          minimum: 1
          default: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Results per page.
        schema:
          minimum: 1
          default: 20
          type: number
      - name: sortBy
        required: false
        in: query
        description: Field to sort by.
        schema:
          default: id
          type: string
          enum:
          - id
          - created_at
          - updated_at
          - status
      - name: sortOrder
        required: false
        in: query
        description: Sort direction.
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Phone numbers returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/PhoneNumberRecord'
                          - type: object
                            properties:
                              is_default:
                                type: boolean
                                description: Whether this is a DialNexa system default number. List rows only.
                      meta:
                        type: object
                        properties:
                          currentPage:
                            type: integer
                            example: 1
                          itemsPerPage:
                            type: integer
                            example: 20
                          hasMore:
                            type: boolean
                            description: True when a further page exists. No total is returned.
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data:
                      items:
                      - id: phn_mfk3p8z2c4v6bn
                        phone_number: '9876543210'
                        status: active
                        country_iso: '91'
                        telephony_provider_id: mh00mke5j83neo
                        organization_id: o14XKPP84rt22g
                        inbound_agent_id: null
                        outbound_agent_id: agent_2g7Xy3tY53gRlp
                        rental_start_date: '2026-09-17'
                        rental_end_date: '2026-10-17'
                        rental_status: active
                        sip_trunk_enabled: false
                        nickname: null
                        is_deleted: false
                        deleted_at: null
                        deleted_by: null
                        created_at: '2026-09-17T05:52:18.634Z'
                        updated_at: '2026-09-17T05:52:18.634Z'
                        is_default: true
                      meta:
                        currentPage: 1
                        itemsPerPage: 20
                        hasMore: false
                    timestamp: '2026-09-07T06:00:00.000Z'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
        '400':
          description: page or limit is below 1 or not a whole number, or sortBy or sortOrder is outside its allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                limit:
                  summary: limit below 1
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: limit must not be less than 1
                    errors:
                    - limit must not be less than 1
                sortOrder:
                  summary: Unknown sortOrder
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: 'sortOrder must be one of the following values: ASC, DESC'
                    errors:
                    - 'sortOrder must be one of the following values: ASC, DESC'
      security:
      - bearer: []
      summary: List Phone Numbers
      tags:
      - Phone Numbers
      description: Returns phone numbers owned by the authenticated workspace with pagination metadata.
  /v1/organization-phone-numbers/plivo-numbers:
    get:
      description: Searches available Plivo phone numbers that match the supplied filters. The response is Plivo's own search result, passed through unchanged.
      operationId: searchAvailablePhoneNumbers
      parameters:
      - name: country_iso
        required: true
        in: query
        description: ISO country code (e.g., IN, US, GB)
        schema:
          example: IN
          type: string
      - name: type
        required: false
        in: query
        description: 'Number type: local, tollfree, or mobile. Defaults to tollfree.'
        schema:
          example: tollfree
          type: string
          default: tollfree
      - name: region
        required: false
        in: query
        description: City or state filter. For IN it is sent to Plivo as city (for example Mumbai, Bengaluru, Chennai). For Mumbai and Bengaluru (or Bangalore) only, a city search that returns no numbers is retried with the city's STD code as a number pattern. For other countries it is sent as region (for example California, Texas).
        schema:
          example: Mumbai
          type: string
      responses:
        '200':
          description: Available Plivo numbers returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/AvailablePhoneNumbersResponse'
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data:
                      api_id: 9f6d7c
                      objects:
                      - number: '14155552671'
                        type: local
                        monthly_rental_rate: '0.80'
                        setup_rate: '0.00'
                        voice_enabled: true
                        sms_enabled: true
                        mms_enabled: false
                        country_iso: US
                        number_format: '14155552671'
                      meta:
                        total_count: 1
                    timestamp: '2026-09-07T06:00:00.000Z'
        '400':
          description: 'Plivo rejected the number search. The message starts with "Failed to fetch phone numbers from Plivo: " followed by Plivo''s error, and the status code is Plivo''s own, so other 4xx codes are possible.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
      security:
      - bearer: []
      summary: Search Plivo Numbers
      tags:
      - Phone Numbers
  /v1/organization-phone-numbers/purchase:
    post:
      description: Purchases the selected provider number (Plivo or Twilio, chosen by telephonyProviderId) and adds it to the authenticated workspace. The workspace KYC must be verified, and a Plivo number in IN needs a compliance ID mapped to the workspace by support. On a workspace with a billing plan, the wallet must hold the plan's rental rate for the provider and country; the first cycle is charged just after the number is set up.
      operationId: purchasePhoneNumber
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasePhoneNumberRequest'
            examples:
              request:
                summary: Purchase a phone number
                value:
                  phoneNumber: '14155552671'
                  telephonyProviderId: mh00mke5j83neo
                  countryISO: US
      responses:
        '400':
          description: Invalid request body, unsupported telephonyProviderId, organization KYC not verified, no compliance ID mapped for an IN Plivo number, phone number rental not configured for the billing plan, insufficient wallet balance, the first rental would go over the monthly spend cap, or the number was bought but could not be set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: countryISO must be a 2-letter uppercase ISO code (e.g., US, IN)
                    errors:
                    - countryISO must be a 2-letter uppercase ISO code (e.g., US, IN)
                spendCap:
                  summary: Monthly spend cap
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: This purchase (₹500.00) would go over your monthly spend cap. Raise the cap in Billing → Balance alerts, or try again after the 1st.
                    errors:
                    - This purchase (₹500.00) would go over your monthly spend cap. Raise the cap in Billing → Balance alerts, or try again after the 1st.
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: 'Error purchasing phone number: Invalid phone number or ISO code'
                    errors: []
        '201':
          description: Purchase processed. Inspect the active or pending status and confirm the saved number before routing calls.
          content:
            application/json:
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      phoneNumber: '14155552671'
                      status: active
                      message: Phone number 14155552671 purchase request sent.
                      organizationPhoneNumber:
                        id: phn_mfk3p8z2c4v6bn
                        phone_number: '4155552671'
                        status: pending
                        country_iso: '1'
                        telephony_provider_id: mh00mke5j83neo
                        organization_id: o14XKPP84rt22g
                        inbound_agent_id: null
                        outbound_agent_id: null
                        rental_start_date: null
                        rental_end_date: null
                        rental_status: null
                        sip_trunk_enabled: false
                        nickname: null
                        is_deleted: false
                        deleted_at: null
                        deleted_by: null
                        created_at: '2026-09-17T05:52:18.634Z'
                        updated_at: '2026-09-17T05:52:18.634Z'
                    timestamp: '2026-09-07T06:00:00.000Z'
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    required:
                    - phoneNumber
                    - status
                    - message
                    properties:
                      phoneNumber:
                        type: string
                        description: The number as sent in the request.
                      status:
                        type: string
                        enum:
                        - active
                        - pending
                        description: Provider purchase status. pending means the provider is still verifying the number.
                      message:
                        type: string
                        example: Phone number 14155552671 purchase request sent.
                      organizationPhoneNumber:
                        allOf:
                        - $ref: '#/components/schemas/PhoneNumberRecord'
                        description: The workspace phone number record as created. Its status is the stored default (pending) at creation; read the number again for its current status and rental dates.
                  timestamp:
                    type: string
                    format: date-time
      security:
      - bearer: []
      summary: Buy Phone Number
      tags:
      - Phone Numbers
  /v1/organization-phone-numbers/sip-trunks:
    post:
      operationId: linkSipTrunk
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkSipTrunkRequest'
            examples:
              request:
                summary: Link a SIP trunk
                value:
                  phoneNumber: '+14155552671'
                  terminationUri: 31974861099010243.zt.plivo.com:5060
                  authMode: userpass
                  sipTrunkUserName: sip-user
                  sipTrunkPassword: YOUR_SIP_PASSWORD
                  nickname: US BYOC Line
      responses:
        '201':
          description: SIP trunk linked successfully.
          content:
            application/json:
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 201
                    message: Success
                    data:
                      id: phn_mfk3p8z2c4v6bn
                      country_iso: '1'
                      phone_number: 4155552671
                      termination_uri: 31974861099010243.zt.plivo.com:5060
                      sip_trunk_enabled: true
                      nickname: US BYOC Line
                      auth_mode: userpass
                      sip_username: sip-user
                    timestamp: '2026-09-07T06:00:00.000Z'
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    required:
                    - id
                    - country_iso
                    - phone_number
                    - termination_uri
                    - sip_trunk_enabled
                    - nickname
                    - auth_mode
                    - sip_username
                    properties:
                      id:
                        type: string
                        example: phn_mfk3p8z2c4v6bn
                        description: Signed phone number ID.
                      country_iso:
                        type: string
                        example: '1'
                        description: Country calling code without the plus sign.
                      phone_number:
                        type: integer
                        format: int64
                        example: 4155552671
                        description: National number without the calling code, as a JSON number.
                      termination_uri:
                        type: string
                        example: 31974861099010243.zt.plivo.com:5060
                      sip_trunk_enabled:
                        type: boolean
                        enum:
                        - true
                      nickname:
                        type:
                        - string
                        - 'null'
                      auth_mode:
                        type: string
                        enum:
                        - userpass
                        - ip
                      sip_username:
                        type:
                        - string
                        - 'null'
                        description: null for authMode ip.
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid number, termination host, authentication mode, or credential combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    statusCode: 400
                    error: true
                    success: false
                    data: []
                    message: sipTrunkUserName and sipTrunkPassword are required when authMode is userpass
                    errors:
                    - sipTrunkUserName and sipTrunkPassword are required when authMode is userpass
        '409':
          description: Phone number already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 409 Conflict
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data: []
                    message: This phone number is already registered for your organization
                    errors: []
        '502':
          description: SIP trunk registration failed. Nothing is saved; retry or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
      security:
      - bearer: []
      summary: Link SIP Trunk
      tags:
      - Phone Numbers
      description: Registers a bring-your-own number with SIP trunk credentials for workspace routing.
  /v1/organization-phone-numbers/{id}:
    delete:
      description: Deletes a workspace phone number, releases its provider rental or SIP connection, unlinks it from its agents, and prevents future DialNexa routing. The request is blocked if the number is a system default, has live calls, is used by a batch that is running, paused, scheduled or waiting, or is used by an active workflow. If the provider rental or SIP trunk cannot be released, the request fails with 502 and the number is kept.
      operationId: deletePhoneNumber
      parameters:
      - name: id
        required: true
        in: path
        description: Phone number ID
        schema:
          example: phn_mfk3p8z2c4v6bn
          type: string
      responses:
        '200':
          description: Phone number deleted successfully. data is the number 200.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: integer
                    enum:
                    - 200
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data: 200
                    timestamp: '2026-09-07T06:00:00.000Z'
        '401':
          description: Unauthorized - missing or invalid API key.
        '404':
          description: Phone number not found.
        '409':
          description: 'Conflict: the number is a system default, has live calls (PHONE_NUMBER_HAS_LIVE_CALLS), is used by a batch that is running, paused, scheduled or waiting (NUMBER_USED_BY_BATCH), or is used by an active workflow (PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numberUsedByBatch:
                  summary: Number used by an unfinished batch
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: NUMBER_USED_BY_BATCH
                      batches:
                      - id: batch_mfh2k9x7q1w3er
                        title: July renewals
                        status: running
                      live_calls: 0
                    message: 1 unfinished batch(es) ("July renewals") and 0 live call(s) use this number. Change the batches' number or cancel them first.
                    errors: []
                phoneNumberHasLiveCalls:
                  summary: Calls in progress on the number
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_HAS_LIVE_CALLS
                      live_calls: 2
                      batches: []
                    message: 2 call(s) are in progress on this number. Wait for them to finish, then retry.
                    errors: []
                phoneNumberUsedInActiveWorkflows:
                  summary: Number used by an active workflow
                  value:
                    statusCode: 409
                    error: true
                    success: false
                    data:
                      code: PHONE_NUMBER_USED_IN_ACTIVE_WORKFLOWS
                      affected_workflows:
                      - id: mfk3p8z2c4v6bn
                        title: Lead follow-up
                        status: active
                    message: This phone number is used in 1 active workflow(s). Pause those workflows first, then retry.
                    errors: []
        '500':
          description: Internal server error.
        '502':
          description: The telephony provider did not release the number, the provider does not support release, or DialNexa could not remove the SIP trunk. The number is not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                providerReleaseFailed:
                  summary: Provider release failed
                  value:
                    statusCode: 502
                    error: true
                    success: false
                    data: []
                    message: Could not release the phone number with the telephony provider. Try again or contact support.
                    errors: []
      security:
      - bearer: []
      summary: Delete Phone Number
      tags:
      - Phone Numbers
    get:
      operationId: getPhoneNumber
      parameters:
      - name: id
        required: true
        in: path
        description: Phone number ID
        schema:
          example: phn_mfk3p8z2c4v6bn
          type: string
      responses:
        '200':
          description: Phone number returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - statusCode
                - message
                - data
                - timestamp
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  error:
                    type: boolean
                    enum:
                    - false
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/PhoneNumberRecord'
                  timestamp:
                    type: string
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    error: false
                    statusCode: 200
                    message: Success
                    data:
                      id: phn_mfk3p8z2c4v6bn
                      phone_number: '9876543210'
                      status: active
                      country_iso: '91'
                      telephony_provider_id: mh00mke5j83neo
                      organization_id: o14XKPP84rt22g
                      inbound_agent_id: null
                      outbound_agent_id: agent_2g7Xy3tY53gRlp
                      rental_start_date: '2026-09-17'
                      rental_end_date: '2026-10-17'
                      rental_status: active
                      sip_trunk_enabled: false
                      nickname: null
                      is_deleted: false
                      deleted_at: null
                      deleted_by: null
                      created_at: '2026-09-17T05:52:18.634Z'
                      updated_at: '2026-09-17T05:52:18.634Z'
                    timestamp: '2026-09-07T06:00:00.000Z'
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    statusCode: 401
                    error: true
                    success: false
                    data: []
                    message: Invalid API key
                    errors: []
        '404':
          description: Phone number not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: 404 Not Found
                  value:
                    statusCode: 404
                    error: true
                    success: false
                    data: []
