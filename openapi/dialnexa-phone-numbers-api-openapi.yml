                error:
                  summary: 500 Internal Server Error
                  value:
                    statusCode: 500
                    error: true
                    success: false
                    data: []
                    message: Internal server error
                    errors: []
      security:
      - bearer: []
      summary: Get Phone Number Details
      tags:
      - Phone Numbers
      description: Returns one workspace phone number and its routing configuration.
components:
  schemas:
    AvailablePhoneNumbersResponse:
      type: object
      properties:
        api_id:
          type: string
          description: API ID for the request
        objects:
          description: List of available phone numbers
          type: array
          items:
            $ref: '#/components/schemas/AvailablePhoneNumber'
        meta:
          type: object
          description: Total count of available numbers
        error:
          type: string
          description: Absent from the response when numbers are found. When Plivo has no numbers for the filters, its explanation, for example We are currently unable to offer your requested numbers; the status is still 200, objects is empty and meta.total_count is 0.
          example: We are currently unable to offer your requested numbers
      required:
      - api_id
      - objects
      - meta
      description: Plivo's search response, passed through unchanged. Plivo can include fields beyond those listed here.
    PhoneCountryRule:
      type: object
      properties:
        id:
          type: string
          example: c7r2n5x8q1w4zt
        country_iso:
          type: string
          minLength: 2
          maxLength: 2
          example: IN
        country_name:
          type: string
          example: India
        calling_code:
          type: string
          example: '91'
        max_length:
          type:
          - integer
          - 'null'
          example: 10
        prefixes:
          type: array
          items:
            type: string
          example:
          - '98'
          - '99'
        is_deleted:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - country_iso
      - country_name
      - calling_code
      - prefixes
      - is_deleted
    EnabledTelephonyNetworkGroup:
      type: object
      properties:
        prefix_mode:
          type: string
          enum:
          - allow_only_listed
        from_phone_number_country_code:
          type:
          - string
          - 'null'
          example: null
        countryRule:
          type: object
          properties:
            country_iso:
              type: string
              example: IN
            country_name:
              type: string
              example: India Mobile
              description: Name of the first enabled network group for the country, for example India Mobile. Not the country name.
            calling_code:
              type: string
              example: '91'
            prefixes:
              type: array
              items:
                type: string
              example:
              - '98'
              - '99'
          required:
          - country_iso
          - country_name
          - calling_code
          - prefixes
      required:
      - prefix_mode
      - from_phone_number_country_code
      - countryRule
    ErrorResponse:
      type: object
      description: Error body on endpoints without response filtering.
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: boolean
          enum:
          - true
        success:
          type: boolean
          enum:
          - false
        data:
          oneOf:
          - type: object
            properties:
              code:
                type: string
                description: Machine-readable refusal code.
          - type: array
            items: {}
          description: For a coded refusal, an object with code and the details listed for that code. Otherwise an empty array.
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Validation messages for a 400. Empty for other errors.
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - statusCode
      - error
      - success
      - data
      - message
      - errors
    AvailablePhoneNumber:
      type: object
      properties:
        number:
          type: string
          description: The phone number, digits only, without a plus sign.
        type:
          type: string
          description: The type of phone number (local, tollfree, etc.)
        monthly_rental_rate:
          type: string
          description: The monthly rental rate for the phone number
        setup_rate:
          type: string
          description: The setup fee for the phone number
        voice_enabled:
          type: boolean
          description: Voice capability of the phone number
        sms_enabled:
          type: boolean
          description: SMS capability of the phone number
        mms_enabled:
          type: boolean
          description: MMS capability of the phone number
        country_iso:
          type: string
          description: Country ISO code
        number_format:
          type: string
          description: The number as Plivo formats it.
      required:
      - number
      - type
      - monthly_rental_rate
      - setup_rate
      - voice_enabled
      - sms_enabled
      - mms_enabled
      - country_iso
      - number_format
    LinkSipTrunkRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          maxLength: 32
          example: '+14155552671'
          description: Phone number in E.164 form with the leading plus, for example +14155552671. It must be a valid number for its country.
        terminationUri:
          type: string
          maxLength: 2048
          example: 31974861099010243.zt.plivo.com:5060
          description: 'SIP termination host[:port]; must not use a sip: URI prefix'
        authMode:
          enum:
          - userpass
          - ip
          type: string
          default: userpass
          description: How the provider authorizes this trunk. 'userpass' requires sipTrunkUserName and sipTrunkPassword; 'ip' requires both to be omitted and expects the provider to have whitelisted our signaling IP.
        sipTrunkUserName:
          type: string
          maxLength: 512
          description: SIP authentication username. Required for authMode=userpass, forbidden for ip.
        sipTrunkPassword:
          type: string
          maxLength: 512
          description: SIP authentication password stored encrypted. Required for authMode=userpass and forbidden for authMode=ip.
        nickname:
          type: string
          maxLength: 255
          description: Display nickname for this trunk
      required:
      - phoneNumber
      - terminationUri
    PurchasePhoneNumberRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          pattern: ^\+?[1-9]\d{5,14}$
          example: '+12025551234'
          description: 'Phone number to purchase: country code followed by the subscriber number, digits only, with or without a leading plus sign. Both +12025551234 and 12025551234 are accepted.'
        telephonyProviderId:
          type: string
          example: mh00mke5j83neo
          description: ID of telephony provider (14-char string)
        countryISO:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          example: US
          description: 'Uppercase two-letter country code of the number being bought, for example US. It must be the number''s own country: a mismatch fails with 500 after the provider step.'
      required:
      - phoneNumber
      - telephonyProviderId
      - countryISO
    PhoneNumberPricing:
      type: object
      properties:
        telephony_provider_id:
          type: string
          example: mh00mke5j83neo
        country_iso:
          type: string
          minLength: 2
          maxLength: 3
          example: IN
        country_name:
          type: string
          example: India
        credit_cost:
          type: string
          example: '500.0000'
          description: Reference rental price as a decimal string with four decimal places.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        telephonyProvider:
          type: object
          additionalProperties: true
          description: Associated telephony provider metadata.
      required:
      - telephony_provider_id
      - country_iso
      - country_name
      - credit_cost
    PhoneNumberRecord:
      type: object
      description: A phone number owned by the workspace, as stored. Returned by the list and get endpoints.
      properties:
        id:
          type: string
          example: phn_mfk3p8z2c4v6bn
          description: Signed phone number ID.
        phone_number:
          type: string
          example: '9876543210'
          pattern: ^[0-9]+$
          description: National number without the country calling code or a plus sign, as a string of digits. Build the E.164 form as + followed by country_iso and phone_number.
        status:
          type: string
          enum:
          - pending
          - active
          description: Provisioning status of the number.
        country_iso:
          type: string
          example: '91'
          description: Country calling code without the plus sign, for example 91 or 1. This is not an ISO country code.
        telephony_provider_id:
          type: string
          description: Telephony provider the number belongs to.
        organization_id:
          type: string
          description: Owning organization.
        inbound_agent_id:
          type:
          - string
          - 'null'
          description: Agent that answers inbound calls on this number, on its latest published version; null when none is linked.
        outbound_agent_id:
          type:
          - string
          - 'null'
          description: Agent that can call from this number; null when none is linked.
        rental_start_date:
          type:
          - string
          - 'null'
          format: date
          example: '2026-09-17'
        rental_end_date:
          type:
          - string
          - 'null'
          format: date
          example: '2026-10-17'
        rental_status:
          type:
          - string
          - 'null'
          enum:
          - active
          - expired
          - available_for_reassignment
        sip_trunk_enabled:
          type: boolean
          description: Whether a SIP trunk is linked to this number.
        nickname:
          type:
          - string
          - 'null'
          description: Label set in the dashboard.
        is_deleted:
          type: boolean
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_by:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - phone_number
      - status
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
