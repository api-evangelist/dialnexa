openapi: 3.2.0
info:
  title: DialNexa Batch Calls API
  description: Public `/v1` REST API for the DialNexa voice AI platform.
  version: 1.0.0
servers:
- url: https://api.dialnexa.com
  description: DialNexa production API
security:
- bearer: []
tags:
- name: Batch Calls
paths:
  /v1/batch-calls:
    post:
      description: Uploads a CSV or Excel file and creates a batch pinned to a published agent version and an outbound number. The response status initiated means accepted; the saved job is waiting or scheduled. Multiple batches can run concurrently within available workspace capacity. A request that fails, for example on row validation, KYC or an unsupported file type, leaves no batch behind.
      operationId: createBatchCall
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - title
              - agent_id
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV, XLSX or XLS file containing leads (max 10 MB). Needs a phone number column; every number must include its country code.
                title:
                  type: string
                  example: Q3 Follow-up Batch
                agent_id:
                  type: string
                  example: agent_abc123
                agent_version_number:
                  type: number
                  example: 1
                  description: Must be a published version. Omit to use the agent's latest published version. The batch stays on this version even if the agent is published again.
                phone_number_id:
                  type: string
                  example: phn_abc123
                  description: One of the agent's outbound numbers to dial from. Required when the agent has more than one outbound number.
                starts_at:
                  type: string
                  example: '2026-10-15T09:00:00Z'
                  description: 'ISO 8601 datetime: leave empty to start immediately'
                ends_at:
                  type: string
                  example: '2026-10-20T18:00:00Z'
                  description: 'ISO 8601 datetime stored with the batch. The scheduler does not enforce it today: calls are not stopped at this time.'
                calling_hours_start:
                  type: string
                  example: 09:00
                  description: Time of day (for example `09:00`) stored with the batch. The scheduler does not enforce it today. The API does not validate it; a value that is not a valid time returns 500.
                calling_hours_end:
                  type: string
                  example: '18:00'
                  description: Time of day (for example `18:00`) stored with the batch. The scheduler does not enforce it today. The API does not validate it; a value that is not a valid time returns 500.
                number_of_retries:
                  type: integer
                  minimum: 0
                  maximum: 4
                  example: 2
                  description: How many times to retry a lead that did not connect, from 0 to 4. Omit both retry fields for no retries. Must be 0 when interval_between_retries is 0, and greater than 0 when it is not; send both fields together.
                interval_between_retries:
                  type: integer
                  minimum: 0
                  maximum: 1440
                  example: 30
                  description: 'Minutes to wait between retries, from 0 to 1440. Must be 0 when number_of_retries is 0, and greater than 0 when it is not. Send it whenever number_of_retries is above 0: without it the retry is scheduled with no wait.'
            examples:
              request:
                summary: Request example
                value:
                  file: leads.csv
                  title: Q3 Follow-up Batch
                  agent_id: agent_abc123
                  agent_version_number: 1
      responses:
        '201':
          description: Batch accepted. status is initiated; from_number identifies the selected outbound number. No scheduling-conflict warning is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: batch_abc123
                  total_records:
                    type: number
                    example: 250
                  dnd_skipped_count:
                    type: number
                    example: 0
                    description: Leads left out because their number is on the workspace's DND list
                  status:
                    type: string
                    example: initiated
                  from_number:
                    type:
                    - string
                    - 'null'
                  title:
                    type: string
              examples:
                success:
                  summary: Successful response
                  value:
                    id: batch_abc123
                    total_records: 250
                    dnd_skipped_count: 0
                    status: initiated
                    from_number: '+14155552671'
                    title: Q3 Follow-up Batch
        '400':
          description: Invalid file, malformed rows or missing required fields, invalid retry or date fields, rows whose numbers fail validation (with validation_errors and invalid_row_count), the resolved agent version is unpublished, the agent has no outbound number, phone_number_id is not one of its outbound numbers (PHONE_NUMBER_NOT_LINKED), or the agent has several outbound numbers and none was chosen (PHONE_NUMBER_REQUIRED, with phone_number_ids in data).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: No valid phone numbers found in CSV'
                titleTooLong:
                  summary: Title too long
                  value:
                    message: 'Request validation failed: title must be 35 characters or fewer (received 42).'
                unpublishedVersion:
                  summary: Agent version is still a draft
                  value:
                    message: 'Request validation failed: Version 2 of agent agent_abc123 is a draft. Publish it before starting a call.'
                phoneNumberNotLinked:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Phone number phn_abc123 is not an outbound number of agent agent_abc123.'
                    data:
                      code: PHONE_NUMBER_NOT_LINKED
                phoneNumberRequired:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Agent agent_abc123 has 2 outbound numbers. Pass phone_number_id to choose which one to dial from.'
                    data:
                      code: PHONE_NUMBER_REQUIRED
                      phone_number_ids:
                      - phn_abc123
                      - phn_def456
                allNumbersOnDnd:
                  summary: Every number is on the DND list
                  value:
                    message: 'Request validation failed: All 2 numbers in this file are on your workspace''s DND list, so there is nothing to call.'
                rowValidation:
                  summary: Rows whose numbers fail validation
                  value:
                    message: 'Request validation failed: 1 phone number failed validation.

                      Phone Number "12345" Could Not Be Parsed. Use International Format Such As +447700900123. (row: 3)'
                    validation_errors:
                    - error: Phone Number "12345" Could Not Be Parsed. Use International Format Such As +447700900123.
                      rows:
                      - 3
                      phone_numbers:
                      - '12345'
                    invalid_row_count: 1
        '401':
          description: Unauthorized - missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '402':
          description: The workspace has no billing plan or no spendable balance, or its monthly spend cap is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 402 Payment Required
                  value:
                    message: Insufficient wallet credits. Please recharge to create campaigns.
                spendCapReached:
                  summary: Monthly spend cap reached
                  value:
                    message: Monthly spend cap reached (₹5,000.00 of ₹5,000.00 used). Raise it in Billing → Balance alerts, or it resets on 1 Nov.
        '403':
          description: The workspace owner's KYC is not verified and a lead's phone number is not the owner's registered number (not enforced for SIP numbers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 'KYC pending: destinations limited to the owner''s registered phone'
                  value:
                    message: Verify Your KYC to schedule a batch
        '404':
          description: Agent not found in the workspace, the requested agent version does not exist, or the uploaded file is not a .csv, .xls or .xlsx file (Unsupported file type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                versionNotFound:
                  summary: Agent version not found
                  value:
                    message: 'Agent agent_abc123 has no version 9. Published versions: 1, 3.'
        '413':
          description: The uploaded file is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 413 Payload Too Large
                  value:
                    message: An unexpected error occurred. Please try again later.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: Create Batch Call
      tags:
      - Batch Calls
    get:
      operationId: listBatchCalls
      parameters:
      - name: page
        required: false
        in: query
        description: Page number, starting from 1.
        schema:
          minimum: 1
          default: 1
          type: integer
      - name: limit
        required: false
        in: query
        description: Results per page.
        schema:
          minimum: 1
          default: 30
          type: integer
      - name: sortBy
        required: false
        in: query
        description: Field to sort by.
        schema:
          default: created_at
          type: string
          enum:
          - created_at
          - updated_at
          - createdAt
          - updatedAt
          - title
          - status
          - id
      - name: sortOrder
        required: false
        in: query
        description: Sort direction.
        schema:
          default: DESC
          type: string
          enum:
          - ASC
          - DESC
      - name: status
        required: false
        in: query
        description: 'Filter by batch status. One value or a comma-separated list of: draft, active, running, paused, completed, cancelled, deleted, scheduled, waiting.'
        schema:
          example: running,paused
          type: string
      responses:
        '200':
          description: Batch calls returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: batch_abc123
                    status:
                      type: string
                      description: Current batch status, for example waiting, scheduled, running, paused, completed or cancelled.
                    title:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                      description: When the batch was created.
              examples:
                success:
                  summary: Successful response
                  value:
                  - id: batch_abc123
                    status: waiting
                    title: Q3 Follow-up Batch
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: page must not be less than 1'
                invalidStatus:
                  summary: Unknown status filter
                  value:
                    message: 'Request validation failed: Error fetching campaigns: Invalid campaign status filter: done. Allowed values: draft, active, running, paused, completed, cancelled, deleted, scheduled, waiting.'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
      security:
      - bearer: []
      summary: List Batch Calls
      tags:
      - Batch Calls
      description: Returns a page of batch jobs, newest first by default, as a root JSON array of ID, title, status, and creation time.
  /v1/batch-calls/{id}:
    get:
      operationId: getBatchCall
      parameters:
      - name: id
        required: true
        in: path
        description: Batch call ID
        schema:
          example: batch_abc123
          type: string
      - name: agent_id
        required: false
        in: query
        description: 'Filter by agent ID: one ID or a comma-separated list (e.g., agent_abc,agent_def). Ignored when agent_version_id is sent, and replaced by agent_version_name when that name matches a version.'
        schema:
          type: string
      - name: call_id
        required: false
        in: query
        description: Filter by call ID - can be a single ID or comma-separated list (e.g., call_abc,call_def)
        schema:
          type: string
      - name: from
        required: false
        in: query
        description: Filter by the workspace phone number on the call (the number dialled from, or for an inbound call the number that was called), as a partial match on its digits.
        schema:
          type: string
      - name: to
        required: false
        in: query
        description: Filter by recipient phone number, as a partial match on the batch lead's number as stored. The value is not reduced to digits, and Indian lead numbers are stored as `91XXXXXXXXXX` without `+`, so send digits only. Only batch calls carry a lead, so single calls and retry attempts never match this filter.
        schema:
          type: string
      - name: type
        required: false
        in: query
        description: 'Filter by call type: one value or a comma-separated list of `phone`, `web`.'
        schema:
          type: string
      - name: call_direction
        required: false
        in: query
        description: 'Filter by call direction: one value or a comma-separated list of `inbound`, `outbound`.'
        schema:
          type: string
      - name: agent_version_id
        required: false
        in: query
        description: Filter batch calls by agent version, written as `<agent_id>-<version_number>` (for example `agent_2g7Xy3tY53gRlp-3`); one value or a comma-separated list. Only calls placed by a batch match. A value in any other format is ignored, and when no value is valid the whole filter is dropped. When this parameter is sent, `agent_id` is not applied.
        schema:
          type: string
          example: agent_2g7Xy3tY53gRlp-3
      - name: agent_version_name
        required: false
        in: query
        description: Search by agent version name (partial match, case-insensitive)
        schema:
          type: string
      - name: sentiment
        required: false
        in: query
        description: 'Filter by user sentiment: one value or a comma-separated list of `positive`, `neutral`, `negative`, `unknown`.'
        schema:
          type: string
      - name: start_date
        required: false
        in: query
        description: Return calls created on or after the start of this day in UTC (ISO 8601). The value is converted to UTC first, then widened to 00:00:00 UTC of that day, so a time with an offset can move the day. Send a plain date (`YYYY-MM-DD`).
        schema:
          type: string
      - name: end_date
        required: false
        in: query
        description: Return calls created on or before the end of this day in UTC (ISO 8601). The value is converted to UTC first, then widened to 23:59:59.999 UTC of that day, so a time with an offset can move the day. Send a plain date (`YYYY-MM-DD`).
        schema:
          type: string
      - name: duration_greater_than
        required: false
        in: query
        description: Return calls longer than this many seconds.
        schema:
          minimum: 0
          type: number
      - name: duration_less_than
        required: false
        in: query
        description: Return calls shorter than this many seconds.
        schema:
          minimum: 0
          type: number
      - name: duration_min
        required: false
        in: query
        description: Lower bound of a duration range in seconds, inclusive. Applied only together with duration_max; sent alone it is ignored.
        schema:
          minimum: 0
          type: number
      - name: duration_max
        required: false
        in: query
        description: Upper bound of a duration range in seconds, inclusive. Applied only together with duration_min; sent alone it is ignored.
        schema:
          minimum: 0
          type: number
      - name: page
        required: false
        in: query
        description: Page number (starts from 1)
        schema:
          minimum: 1
          example: 1
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of records per page. Minimum 1, maximum 200.
        schema:
          minimum: 1
          maximum: 200
          default: 20
          example: 20
          type: integer
      - name: created_at
        required: false
        in: query
        description: Sort by created_at (asc or desc)
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: duration
        required: false
        in: query
        description: Sort by duration (asc or desc)
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: status
        required: false
        in: query
        description: 'Filter by call status: one value or a comma-separated list, for example completed,failed. Values: initiated, received, sent, did_not_pick, busy, failed, no_answer, completed, created, cancelled, retry_expired. An unknown value returns 400.'
        schema:
          type: string
      - name: export
        required: false
        in: query
        description: Set to `true` to return every matching call in one JSON array without pagination, up to the export row limit, including retry attempts. Omit it or send `false` to receive pages. For a batch export, the row limit counts the original calls only; retry attempts are added on top, so the array can be longer.
        schema:
          type: boolean
      - name: end_reason
        required: false
        in: query
        description: 'Filter by why the call ended: one value or a comma-separated list of `agent_disconnected`, `user_disconnected`, `user_busy`, `user_did_not_pick_up`, `invalid_phone_number`, `unallocated_phone_number`, `unknown`, `network_failure`, `voicemail_detected`, `user_unreachable`, `destination_forbidden`, `system_failure`, `system_at_capacity`, `insufficient_balance`, `agent_not_found`, `sip_auth_failed`, `sip_trunk_unreachable`, `spend_cap_reached`, `dnd_blocked`. Unknown values are ignored; if no value is known, no calls match.'
        schema:
          type: string
      - name: is_ivr
        required: false
        in: query
        description: Filter by whether the call was handled by an IVR agent (matched by the call's agent and/or the IVR billing flag, so both promoted/transferred and pure menu calls count). true = IVR calls only; false = non-IVR calls only; omit for all.
        schema:
          type: boolean
      - name: tags
        required: false
        in: query
        description: 'Filter by lead tags: the tags attached to the workflow lead when its leads file was uploaded, snapshotted onto the call when it was placed. Comma-separated for multiple values. Matching is case-insensitive because tags are normalized to lowercase on upload. Use tags_match to choose ANY (default) or ALL.'
        schema:
          example: priority,q3-campaign
          type: string
      - name: tags_match
        required: false
        in: query
        description: 'How multiple `tags` values combine: "any" returns calls carrying at least one of them (default), "all" returns only calls carrying every one of them.'
        schema:
          default: any
          type: string
          enum:
          - any
          - all
      - name: columns
        required: false
        in: query
        description: 'Export only: comma-separated list of column keys being exported (e.g. "duration,status,end_reason"). Lets the server skip fetching heavy columns nobody asked for, which raises the export row limit. Omit to fetch everything, as before.'
        schema:
          type: string
      - name: agent_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - single_prompt
          - conversational_flow
          - speech_to_speech
          - ivr
        description: Filter by agent type. ivr is equivalent to is_ivr=true and includes IVR handoffs. Other types require an agent ID retained on the call; calls without one do not match those types.
      responses:
        '200':
          description: Calls in the batch returned successfully.
          content:
            application/json:
              examples:
                success:
                  summary: Calls in the batch
                  value:
                  - id: call_abc123
                    agent_id: agent_2g7Xy3tY53gRlp
                    batch_id: batch_abc123
                    to_number: '919876543210'
                    phone_number_id: phn_abc123
                    duration: '42'
                    status: completed
                    end_reason: user_disconnected
                    llm_name: gpt-4o
              schema:
                type: array
                description: The calls created for this batch, one record per lead. Paginated with page and limit unless export=true; retry attempts appear only with export=true.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: call_abc123
                      description: Signed call ID.
                    agent_id:
                      type:
                      - string
                      - 'null'
                      example: agent_2g7Xy3tY53gRlp
                      description: Agent that handled the call.
                    batch_id:
                      type:
                      - string
                      - 'null'
                      example: batch_abc123
                      description: Signed batch ID of the batch the call belongs to; null for single calls and for retry attempts.
                    to_number:
                      type:
                      - string
                      - 'null'
                      example: '919876543210'
                      description: 'Destination number as recorded on the call: the number as sent for a single call, and the lead''s number as stored for a batch call, where an Indian number appears as `91XXXXXXXXXX` without `+`.'
                    phone_number_id:
                      type:
                      - string
                      - 'null'
                      example: phn_abc123
                      description: ID of the workspace phone number the call was placed from.
                    called_time:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: When the call was placed.
                    duration:
                      type:
                      - string
                      - 'null'
                      example: '42'
                      description: Call duration in seconds, serialized as a string (the column is a 64-bit integer); null until a duration is recorded.
                    status:
                      type: string
                      example: completed
                      description: Current call status.
                    initiated_time:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: When the call was initiated on the telephony side.
                    end_reason:
                      type:
                      - string
                      - 'null'
                      example: user_disconnected
                      description: Why the call ended; `unknown` until the call ends. One of `agent_disconnected`, `user_disconnected`, `user_busy`, `user_did_not_pick_up`, `invalid_phone_number`, `unallocated_phone_number`, `unknown`, `network_failure`, `voicemail_detected`, `user_unreachable`, `destination_forbidden`, `system_failure`, `system_at_capacity`, `insufficient_balance`, `agent_not_found`, `sip_auth_failed`, `sip_trunk_unreachable`, `spend_cap_reached`, `dnd_blocked`.
                    postcallanalysis:
                      type:
                      - object
                      - 'null'
                      additionalProperties: true
                      description: Post-call analysis fields extracted for this call, keyed by field name. An empty object until analysis has run.
                    llm_name:
                      type:
                      - string
                      - 'null'
                      example: gpt-4o
                      description: Display name of the language model used on the call.
                    voice_model_name:
                      type:
                      - string
                      - 'null'
                      description: Display name of the voice used on the call.
                    recording_sas_url:
                      type:
                      - string
                      - 'null'
                      description: Time-limited link to the recording. Absent from the response unless export=true.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 401 Unauthorized
                  value:
                    message: API key is missing or invalid. You can generate this by logging in into dashboard
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 500 Internal Server Error
                  value:
                    message: An unexpected error occurred. Please try again later.
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: limit must not be greater than 200'
                unknownFilterValue:
                  summary: Unknown filter value
                  value:
                    message: 'Request validation failed: Invalid status filter value: foo. Allowed values: initiated, received, sent, did_not_pick, busy, failed, no_answer, completed, created, cancelled, retry_expired'
      security:
      - bearer: []
      summary: Get Batch Call Details
      tags:
      - Batch Calls
      description: Returns the calls created for one batch as a root JSON array, paginated with page and limit unless export=true. An unknown batch ID, or one from another workspace, returns an empty array. Paginated results leave out retry attempts; export=true includes them.
  /v1/batch-calls/{id}/status:
    patch:
      operationId: updateBatchCallStatus
      summary: Update Batch Call Status
      description: Changes the execution status of a batch call. Use `pause` to halt new outbound calls, `resume` to continue a paused batch, or `cancel` to permanently stop the batch and remove queued calls.
      parameters:
      - name: id
        required: true
        in: path
        description: Batch call ID
        schema:
          example: batch_abc123
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBatchCallStatusRequest'
            examples:
              pause:
                summary: Pause a batch call
                value:
                  action: pause
              resume:
                summary: Resume a batch call
                value:
                  action: resume
              cancel:
                summary: Cancel a batch call
                value:
                  action: cancel
      responses:
        '200':
          description: Batch call status updated successfully.
          content:
            application/json:
              examples:
                success:
                  summary: Successful response
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: Invalid action, or action not allowed for the current batch call status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: action must be one of the following values: pause, resume, cancel'
                notAllowed:
                  summary: Action not allowed for the batch status
                  value:
                    message: 'Request validation failed: Campaign status ''paused'' is not allowed. Required status: running or waiting'
                finalState:
                  summary: Batch already finished
                  value:
                    message: 'Request validation failed: Campaign status ''completed'' is not allowed. Campaign is already in a final state.'
        '401':
