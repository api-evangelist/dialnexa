  /v1/batch-calls/{id}/phone-number:
    patch:
      operationId: changeBatchCallPhoneNumber
      summary: Change Batch Call Phone Number
      description: Changes the From number for a draft, scheduled, or paused batch to another outbound number linked to its agent. Pause running or waiting batches first and wait for in-progress calls to finish. Undialed calls and parked retries use the new number; placed calls keep their original number. The agent version and batch status stay the same.
      tags:
      - Batch Calls
      security:
      - bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: batch_abc123
        description: Batch ID from List Batch Calls.
      responses:
        '200':
          description: The number was changed. API-key callers receive an empty object because the response projection omits the control result.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                success:
                  value: {}
        '400':
          description: 'PHONE_NUMBER_NOT_LINKED: choose an outbound number of this agent. BATCH_TERMINAL: a batch whose status is completed, cancelled or deleted cannot change numbers. Invalid request bodies also return 400.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  value:
                    message: 'Request validation failed: phone_number_id must be a string'
                batchTerminal:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Batch "Q3 Follow-up Batch" is completed; its number can no longer change.'
                    data:
                      code: BATCH_TERMINAL
                phoneNumberNotLinked:
                  summary: 400 Bad Request
                  value:
                    message: 'Request validation failed: Phone number phn_2g7Xy3tY53gRlp is not an outbound number of agent agent_mgao6051Rk718Y.'
                    data:
                      code: PHONE_NUMBER_NOT_LINKED
        '404':
          description: Batch not found in this workspace, including a batch that has been removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
                error:
                  value:
                    message: Campaign with ID 2g7Xy3tY53gRlp not found
        '409':
          description: 'BATCH_NOT_PAUSED: pause the batch first. BATCH_HAS_LIVE_CALLS: wait until its in-progress calls finish.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredErrorResponse'
              examples:
