components:
  schemas:
    FilteredErrorResponse:
      type: object
      description: Error body on calls, batch calls, voices, languages and LLMs, which return only the message (and data for a coded refusal).
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable refusal code.
          description: 'Present for a coded refusal: code and the details listed for that code.'
        validation_errors:
          type: array
          description: 'Present when uploaded rows fail number validation (batch and workflow lead uploads): one group per distinct error.'
          items:
            type: object
            properties:
              error:
                type: string
              rows:
                type: array
                items:
                  type: integer
                description: Row numbers with this error.
              phone_numbers:
                type: array
                items:
                  type: string
        invalid_row_count:
          type: integer
          description: 'Present with validation_errors: how many rows failed.'
      required:
      - message
    UpdateBatchCallStatusRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - pause
          - resume
          - cancel
          description: pause stops new outbound calls and keeps the batch resumable; resume re-enqueues the remaining leads; cancel removes queued calls and cannot be resumed. cancel works from any state except completed or cancelled, including running.
          example: pause
      required:
      - action
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
