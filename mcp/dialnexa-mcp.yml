name: DialNexa MCP Server
description: >-
  Official hosted remote MCP server for the DialNexa Voice AI platform. Implements stateless MCP
  Streamable HTTP at https://api.dialnexa.com/v1/mcp with OAuth 2.1 (authorization-code + PKCE,
  workspace selection at consent) or a workspace API key as a Bearer token. Documented tool
  reference covers 97 tools across 14 families: agents, calls, batch calls, workflows, knowledge
  base, phone numbers, reference data, templates, billing, webhooks, organization, dashboard,
  integrations, and prompt suggestions. Every reference page classifies its tool as read-only,
  state-changing, destructive, or billable, and billable/destructive tools require explicit
  user confirmation.
