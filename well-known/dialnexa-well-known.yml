method: probed
source: https://dialnexa.com/.well-known/ + https://api.dialnexa.com/.well-known/
note: >-
  DialNexa serves a rich discovery surface on TWO hosts. dialnexa.com publishes an RFC 9727
  api-catalog (proper application/linkset+json), RFC 8414 authorization-server metadata with a
  custom agent_auth block that points at a provider-published Agent Skill under
  /.well-known/agent-skills/dialnexa/SKILL.md (saved to skills/dialnexa-agent-skill.md), and RFC
  9728 protected-resource metadata for the REST API. api.dialnexa.com publishes full OAuth 2.1
  authorization-server metadata (PKCE S256, PAR, DPoP, scopes mcp:read/mcp:write/offline_access/
  openid) plus openid-configuration (byte-identical) and protected-resource metadata for the MCP
  endpoint https://api.dialnexa.com/v1/mcp. No security.txt on any host. dialnexa.com answers 200
  with a ~15KB SPA shell for unknown /.well-known/* paths (openid-configuration among them) —
  those soft-200s are recorded as status 200 with note soft-200 and are NOT documents.
  www.dialnexa.com mirrors dialnexa.com byte-for-byte and is not indexed separately.
hosts:
- host: dialnexa.com
  documents:
  - path: /.well-known/api-catalog
