x-provenance:
  added: '2026-08-21'
  method: searched
  source: https://dialnexa.com/llms.txt
  note: >-
    Submitted via apis.io/add on 2026-08-21 (twice, as "DialNexa" and "DialNexa | Voice AI Agents
    Platform" — one provider, two records at the gate). The submitted APIs.json URL,
    https://dialnexa.com/apis.json, returns 404; that is a bad pointer in the submission, not an
    absent surface.
    A NOTE ON HOW THIS WAS FOUND, because the first pass got it wrong. Probing guessed paths
    (/openapi.json, /developers, /api-docs) suggested DialNexa published nothing: /openapi.json
    404s, and /developers and /api-docs both return HTTP 200 with the same ~14,930-byte SPA shell
    the site serves for any unknown path, including an invented control. Reading the provider's
    own llms.txt instead produced the real locations, and they are all live: an
    application/linkset+json api-catalog, a 352KB OpenAPI under /docs/api-reference/, a 90KB
    documentation llms.txt, and an auth.md addressed to AI agents. Guessing paths on a soft-200
    host produces a false negative; the provider's own index is the authority.
