aid: dialnexa
name: DialNexa
description: >-
  DialNexa is a Voice AI agents platform for sales calls, lead qualification, follow-ups, meeting
  booking, collections and support workflows, with a strong focus on Indian-market multilingual
  calling (English, Hindi, Hinglish, Marathi, Kannada, Gujarati, Tamil, Telugu, Bengali and
  mixed-language calls). The public contract is an OpenAPI 3.0 document of 41 paths and 54
  operations served from api.dialnexa.com with bearer authentication. DialNexa publishes an
  RFC 9727 api-catalog as a proper application/linkset+json document, two llms.txt files (a site
  index and a 90KB documentation index), and an auth.md written explicitly for AI agents and
  automation systems describing how API keys are provisioned.
