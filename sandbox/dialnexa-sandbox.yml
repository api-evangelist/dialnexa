description: >-
  DialNexa has no separate sandbox environment, test-mode key prefixes, or simulated telephony -
  testing happens against production with real (billable) calls. What the provider does publish:
  an interactive playground on every endpoint reference page ("Every endpoint in the reference
  includes a built-in playground for quick testing"), a documented agent-testing flow using phone
  test calls against published agent versions with country validation and dynamic variables, and
  explicit guidance to use a dedicated test workspace when evaluating MCP tools that change data
  or spend wallet balance. The MCP preview_batch_call_leads tool previews leads before a campaign
  is created.
